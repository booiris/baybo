[package]
name = "aura-setup"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

# Test-only probe driven by `tests/picker_render.rs` inside a tmux pane.
# Gated on `test-support` so it never builds (or ships) in a release build;
# `cargo test` turns the feature on via the dev-dependency below, which is
# what makes `CARGO_BIN_EXE_picker_probe` available to the test.
[[bin]]
name = "picker_probe"
path = "src/bin/picker_probe.rs"
required-features = ["test-support"]
test = false
bench = false

[dependencies]
aura-agent = { workspace = true }
aura-channels = { workspace = true }
aura-config = { workspace = true }
aura-gateway = { workspace = true }
aura-llm = { workspace = true }
aura-model = { workspace = true }
aura-security = { workspace = true }
aura-storage = { workspace = true }
aura-store = { workspace = true }
aura-workspace = { workspace = true }

anyhow = { workspace = true }
crossterm = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[features]
# Gates the in-crate `MockPrompter` so it stays out of release builds.
test-support = []

[dev-dependencies]
aura-setup = { workspace = true, features = ["test-support"] }
aura-storage = { workspace = true, features = ["test-support"] }
aura-term-harness = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
