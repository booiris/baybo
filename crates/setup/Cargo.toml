[package]
name = "baybo-setup"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
baybo-agent = { workspace = true }
baybo-channels = { workspace = true }
baybo-config = { workspace = true }
baybo-gateway = { workspace = true }
baybo-llm = { workspace = true }
baybo-model = { workspace = true }
baybo-security = { workspace = true }
baybo-storage = { workspace = true }
baybo-store = { workspace = true }
baybo-workspace = { workspace = true }

anyhow = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[features]
# Gates the in-crate `MockPrompter` so it stays out of release builds.
test-support = []

[dev-dependencies]
baybo-storage = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
