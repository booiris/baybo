[package]
name = "aura-channels"
version.workspace = true
edition.workspace = true

[features]
# WebSocket + MessagePack SDK for Rust sidecars: wire types, `Client`,
# and the native transport (tokio-tungstenite over `UnixStream`). This
# is the only consumer surface — TS / JS sidecars speak the same wire
# protocol through the hand-written `sdks/channel-ts/` package.
sdk = ["dep:rmp-serde", "dep:futures", "dep:tokio-tungstenite", "dep:hex"]
# Enables the `export_ts_bindings` test that writes ts-rs-generated
# TypeScript definitions for `Message` / `Frame` into
# `sdks/channel-ts/src/generated/`. Kept behind a feature so CI /
# release builds don't depend on ts-rs. The embedded
# `aura_model::ChannelType` is emitted as plain `string` via a
# field-level `#[ts(type = "string")]` override so ts-rs doesn't
# chase the domain crate.
ts-export = ["sdk", "dep:ts-rs"]

[dependencies]
aura-model = { workspace = true }
aura-tools = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }

# Optional — shared by `sdk` feature family.
rmp-serde = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

# Optional — only pulled in for the `ts-export` feature so that
# release builds don't have to compile ts-rs.
ts-rs = { workspace = true, optional = true }

tokio-tungstenite = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
axum = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
