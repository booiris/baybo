[package]
name = "aura-channels"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
# Emits ts-rs-generated TypeScript definitions for `Message` / `Frame`
# into `sdks/channel-ts/src/generated/`. Kept behind a feature so CI /
# release builds don't depend on ts-rs. The embedded
# `aura_model::ChannelType` is emitted as plain `string` via a
# field-level `#[ts(type = "string")]` override so ts-rs doesn't
# chase the domain crate.
ts-export = ["dep:ts-rs", "aura-model/ts-export"]

[dependencies]
aura-model = { workspace = true }
aura-tools = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
anyhow = { workspace = true }

# Optional — only pulled in for the `ts-export` feature so that
# release builds don't have to compile ts-rs.
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
