[package]
name = "baybo-channels"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
# Emits ts-rs-generated TypeScript definitions for the registration-wire
# types (`PromptKind` / `RegisterIn` / `RegisterOut`) into
# `sdks/channel-ts/src/generated/`. The `Frame` / `Message` wire types now
# live in `wire` and carry their own `ts-export`; this feature covers
# only the types still defined in this crate. Kept behind a feature so CI /
# release builds don't depend on ts-rs.
ts-export = ["dep:ts-rs"]

[dependencies]
baybo-model = { workspace = true }
wire = { workspace = true }
baybo-tools = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }

# Optional — only pulled in for the `ts-export` feature so that
# release builds don't have to compile ts-rs.
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
