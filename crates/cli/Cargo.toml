[package]
name = "baybo-cli"
version.workspace = true
edition.workspace = true
# See `crates/integration-tests/Cargo.toml` for the rationale: aggregating
# tests/*.rs into one binary saves the per-binary link of the CLI graph.
autotests = false

[lib]
doctest = false

[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
baybo-model = { workspace = true }
baybo-agent = { workspace = true }
baybo-context = { workspace = true }
baybo-channels = { workspace = true }
baybo-config = { workspace = true }
baybo-gateway = { workspace = true }
baybo-cron = { workspace = true }
baybo-cost = { workspace = true }
baybo-turn = { workspace = true }
baybo-pairing = { workspace = true }
baybo-query = { workspace = true }
baybo-skills = { workspace = true }
baybo-skills-assessor = { workspace = true }
baybo-session = { workspace = true }
baybo-storage = { workspace = true }
baybo-store = { workspace = true }
baybo-security = { workspace = true }
baybo-tools = { workspace = true }
baybo-trace = { workspace = true }
baybo-llm = { workspace = true }
baybo-memory = { workspace = true }
baybo-setup = { workspace = true }
baybo-tui = { workspace = true }
baybo-workspace = { workspace = true, features = ["io"] }

async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
qrcode = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

clap = { workspace = true }
clap_complete = { workspace = true }
crossterm = { workspace = true }
shell-words = { workspace = true }
libc = { workspace = true }

[features]
test-support = []

[dev-dependencies]
baybo-cron = { workspace = true, features = ["test-support"] }
baybo-security = { workspace = true, features = ["test-support"] }
baybo-storage = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
