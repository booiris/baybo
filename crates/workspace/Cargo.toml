[package]
name = "aura-workspace"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
tokio = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

[features]
# `io` brings in async identity-file readers/writers and `WorkspaceManager`.
# Pure-data consumers (aura-config and similar leaf crates) opt out via
# `default-features = false` to avoid a transitive tokio/anyhow dep when
# they only need path constants and `WorkspacePaths`.
default = ["io"]
io = ["dep:tokio", "dep:anyhow"]
# Bench builds run inside an ephemeral single-task container: `ensure_layout`
# skips the identity-repo `git init`, so aura boots without `git` on PATH (no
# slow per-task `apt-get install git`). Enabled via the root crate's `bench-bash`.
bench-bash = []
