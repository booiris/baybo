[package]
name = "baybo-tools"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
# Exposes `EchoTool` and `RecordingTool` (test stubs) to downstream
# crates' tests. Pull in via:
#   baybo-tools = { workspace = true, features = ["test-support"] }
# inside the consumer's `[dev-dependencies]`.
test-support = []
# `BashTool`'s bench profile — raw exec inside a disposable container (no uv, no
# work-dir jail, inherited cwd, dedicated prompt). Off by default; see the root
# crate's `bench-bash`.
bench-bash = []
# Emits ts-rs-generated TypeScript definitions for the Baybo-specific
# `_meta.baybo.*` annotations the embedded MCP servers carry on each
# tool descriptor. Kept behind a feature so release builds don't pull
# in ts-rs. Generated files land under
# `sidecars/tool/browser/src/generated/` so the browser sidecar imports the
# same types the Rust client deserializes — wire drift is a compile
# error on the TS side.
ts-export = ["dep:ts-rs"]

[dependencies]
baybo-llm = { workspace = true }
baybo-model = { workspace = true }
baybo-security = { workspace = true }
baybo-session = { workspace = true }
baybo-storage = { workspace = true }
baybo-store = { workspace = true }
baybo-trace = { workspace = true }
baybo-workspace = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
iana-time-zone = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tokio-util = { workspace = true }
lofty = { workspace = true }
mp4 = { workspace = true }
matroska = { workspace = true }
libc = { workspace = true }
anyhow = { workspace = true }
shell-words = { workspace = true }
brush-parser = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
dom_smoothie = { workspace = true }
htmd = { workspace = true }
# MCP client + OAuth: rmcp owns the protocol/transport surface, oauth2
# powers the authorization-code+PKCE flow inside `baybo mcp add`, `open`
# launches the user's browser at authorization time, base64 encodes the
# PKCE challenge.
rmcp = { workspace = true }
oauth2 = { workspace = true }
open = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
axum = { workspace = true }
uuid = { workspace = true }

# Optional — only pulled in for the `ts-export` feature so that
# release builds don't have to compile ts-rs.
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
baybo-llm = { workspace = true, features = ["test-support"] }
baybo-session = { workspace = true, features = ["test-support"] }
baybo-storage = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
