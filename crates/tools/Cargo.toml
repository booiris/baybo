[package]
name = "aura-tools"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
# Exposes `EchoTool` and `RecordingTool` (test stubs) to downstream
# crates' tests. Pull in via:
#   aura-tools = { workspace = true, features = ["test-support"] }
# inside the consumer's `[dev-dependencies]`.
test-support = []
# Emits ts-rs-generated TypeScript definitions for the Aura-specific
# `_meta.aura.*` annotations the embedded MCP servers carry on each
# tool descriptor. Kept behind a feature so release builds don't pull
# in ts-rs. Generated files land under
# `tool-src/browser/src/generated/` so the browser sidecar imports the
# same types the Rust client deserializes — wire drift is a compile
# error on the TS side.
ts-export = ["dep:ts-rs"]

[dependencies]
aura-llm = { workspace = true }
aura-model = { workspace = true }
aura-security = { workspace = true }
aura-session = { workspace = true }
aura-storage = { workspace = true }
aura-store = { workspace = true }
aura-trace = { workspace = true }
aura-workspace = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
iana-time-zone = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
glob = { workspace = true }
shell-words = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
dom_smoothie = { workspace = true }
htmd = { workspace = true }
# MCP client + OAuth: rmcp owns the protocol/transport surface, oauth2
# powers the authorization-code+PKCE flow inside `aura mcp add`, `open`
# launches the user's browser at authorization time, base64 encodes the
# PKCE challenge.
rmcp = { workspace = true }
oauth2 = { workspace = true }
open = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
axum = { workspace = true }
uuid = { workspace = true }

# Optional — only pulled in for the `ts-export` feature so that
# release builds don't have to compile ts-rs.
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
aura-llm = { workspace = true, features = ["test-support"] }
aura-session = { workspace = true, features = ["test-support"] }
aura-storage = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
