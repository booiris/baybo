[package]
name = "aura-tools"
version.workspace = true
edition.workspace = true

[features]
# Exposes `EchoTool` and `RecordingTool` (test stubs) to downstream
# crates' tests. Pull in via:
#   aura-tools = { workspace = true, features = ["test-support"] }
# inside the consumer's `[dev-dependencies]`.
test-support = []

[dependencies]
aura-model = { workspace = true }
aura-security = { workspace = true }
aura-storage = { workspace = true }
aura-workspace = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
iana-time-zone = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
glob = { workspace = true }
walkdir = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
htmd = { workspace = true }
# MCP client + OAuth: rmcp owns the protocol/transport surface, oauth2
# powers the authorization-code+PKCE flow inside `aura mcp add`, `open`
# launches the user's browser at authorization time, base64 encodes the
# PKCE challenge.
rmcp = { workspace = true }
oauth2 = { workspace = true }
open = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
axum = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
aura-storage = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
