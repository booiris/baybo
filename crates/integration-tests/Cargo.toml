[package]
name = "baybo-integration-tests"
version.workspace = true
edition.workspace = true
publish = false
# Suppress per-file test discovery — every `tests/*.rs` would otherwise
# become its own binary and re-link the whole upper dep graph (200s+
# each on a debug build). `tests/all.rs` aggregates them via `#[path]`
# so the link cost is paid once.
autotests = false

[lib]
doctest = false

[[test]]
name = "all"
path = "tests/all.rs"

# This crate is a pure dev-only fixture library. It owns no production
# code — `src/lib.rs` exposes builders and helpers that compose multiple
# workspace crates' `test-support` features so that the e2e suites under
# `tests/` can stay focused on the scenarios under test. No business
# crate should ever depend on this; it lives outside the production
# graph entirely.

[dependencies]
baybo-agent = { workspace = true }
baybo-channels = { workspace = true }
baybo-context = { workspace = true }
baybo-cost = { workspace = true, features = ["test-support"] }
baybo-cron = { workspace = true, features = ["test-support"] }
baybo-job = { workspace = true, features = ["test-support"] }
baybo-llm = { workspace = true, features = ["test-support"] }
baybo-memory = { workspace = true, features = ["test-support"] }
baybo-model = { workspace = true }
baybo-security = { workspace = true, features = ["test-support"] }
baybo-session = { workspace = true, features = ["test-support"] }
baybo-skills = { workspace = true }
baybo-storage = { workspace = true, features = ["test-support"] }
baybo-store = { workspace = true }
baybo-subagent = { workspace = true }
baybo-task = { workspace = true, features = ["test-support"] }
baybo-tools = { workspace = true, features = ["test-support"] }
baybo-trace = { workspace = true, features = ["test-support"] }
baybo-workspace = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "test-util"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
baybo-cli = { workspace = true, features = ["test-support"] }
baybo-gateway = { workspace = true }
baybo-setup = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }
