[package]
name = "aura-integration-tests"
version.workspace = true
edition.workspace = true
publish = false
# Suppress per-file test discovery — every `tests/*.rs` would otherwise
# become its own binary and re-link the whole upper dep graph (200s+
# each on a debug build). `tests/all.rs` aggregates them via `#[path]`
# so the link cost is paid once.
autotests = false

[lib]
doctest = false

[[test]]
name = "all"
path = "tests/all.rs"

# This crate is a pure dev-only fixture library. It owns no production
# code — `src/lib.rs` exposes builders and helpers that compose multiple
# workspace crates' `test-support` features so that the e2e suites under
# `tests/` can stay focused on the scenarios under test. No business
# crate should ever depend on this; it lives outside the production
# graph entirely.

[dependencies]
aura-agent = { workspace = true }
aura-channels = { workspace = true }
aura-context = { workspace = true }
aura-cost = { workspace = true, features = ["test-support"] }
aura-job = { workspace = true, features = ["test-support"] }
aura-llm = { workspace = true, features = ["test-support"] }
aura-memory = { workspace = true, features = ["test-support"] }
aura-model = { workspace = true }
aura-security = { workspace = true, features = ["test-support"] }
aura-session = { workspace = true, features = ["test-support"] }
aura-skills = { workspace = true }
aura-storage = { workspace = true, features = ["test-support"] }
aura-store = { workspace = true }
aura-tools = { workspace = true, features = ["test-support"] }
aura-trace = { workspace = true, features = ["test-support"] }
aura-workspace = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "test-util"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
aura-cli = { workspace = true, features = ["test-support"] }
aura-gateway = { workspace = true }
aura-setup = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }
