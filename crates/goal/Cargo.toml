[package]
name = "aura-goal"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
# Exposes the in-memory `MemoryGoalStore` fixture to downstream crates' tests.
# Enable via `aura-goal = { workspace = true, features = ["test-support"] }`
# in a dev-dependency. Not enabled by default; production builds never see it.
test-support = []

[dependencies]
aura-model = { workspace = true }
aura-store = { workspace = true }
aura-tools = { workspace = true }

async-trait = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
aura-workspace = { workspace = true }
tokio-util = { workspace = true }
