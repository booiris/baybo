[package]
name = "baybo-security"
version.workspace = true
edition.workspace = true
autotests = false

[lib]
doctest = false

# Single aggregated integration-test binary: each sibling file is mounted as a
# module so the harness links once instead of per-file. See `tests/all.rs`.
[[test]]
name = "all"
path = "tests/all.rs"

[features]
test-support = ["dep:parking_lot"]

[dependencies]
baybo-model = { workspace = true }
baybo-store = { workspace = true }
parking_lot = { workspace = true, optional = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
aho-corasick = { workspace = true }
uuid = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
baybo-security = { path = ".", features = ["test-support"] }
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["full"] }
chrono = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
