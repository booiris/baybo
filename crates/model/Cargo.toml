[package]
name = "baybo-model"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
# Emit ts-rs-generated TypeScript definitions for the wire-visible
# subset of approval / message types into
# `sidecars/sdk/channel-ts/src/generated/`. Kept behind a feature so CI /
# release builds don't depend on ts-rs.
ts-export = ["dep:ts-rs"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
uuid = { workspace = true }
ulid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

ts-rs = { workspace = true, optional = true }
