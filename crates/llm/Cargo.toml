[package]
name = "aura-llm"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

# Parses the bundled OpenRouter snapshot at build time to generate each
# provider's `known_models` list + flat-default pricing (see `build.rs`).
[build-dependencies]
serde_json = { workspace = true }

[features]
# Exposes `StubLlm` and the `LlmStream::from_events` constructor for
# downstream crates' tests. Pull in via:
#   aura-llm = { workspace = true, features = ["test-support"] }
# inside the consumer's `[dev-dependencies]`.
test-support = []

[dependencies]
aura-model = { workspace = true }
aura-security = { workspace = true }
parking_lot = { workspace = true }
rig = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
reqwest = { workspace = true, features = ["json", "stream"] }
chrono = { workspace = true }
url = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
async-stream = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
aura-security = { workspace = true, features = ["test-support"] }
aura-storage = { workspace = true, features = ["test-support"] }
aura-store = { workspace = true }
