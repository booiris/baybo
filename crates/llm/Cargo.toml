[package]
name = "baybo-llm"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

# Parses the bundled OpenRouter snapshot at build time to generate each
# provider's `known_models` list + flat-default pricing (see `build.rs`).
[build-dependencies]
serde_json = { workspace = true }

[features]
# Exposes `StubLlm` and the `LlmStream::from_events` constructor for
# downstream crates' tests. Pull in via:
#   baybo-llm = { workspace = true, features = ["test-support"] }
# inside the consumer's `[dev-dependencies]`.
# `media_probe::fixture` builds the compressed object stream and the WAVE
# container the probes have to see through; downstream ingest tests need
# payloads that really parse, not byte soup.
test-support = ["dep:flate2"]

[dependencies]
baybo-model = { workspace = true }
baybo-security = { workspace = true }
baybo-store = { workspace = true }
parking_lot = { workspace = true }
rig = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
reqwest = { workspace = true, features = ["json", "stream"] }
chrono = { workspace = true }
url = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
async-stream = { workspace = true }
bytes = { workspace = true }
lopdf = { workspace = true }
lofty = { workspace = true }
imagesize = { workspace = true }
flate2 = { workspace = true, optional = true }

[dev-dependencies]
baybo-security = { workspace = true, features = ["test-support"] }
flate2 = { workspace = true }
tempfile = { workspace = true }
baybo-storage = { workspace = true, features = ["test-support"] }
