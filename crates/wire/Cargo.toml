[package]
name = "wire"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
# Emits ts-rs-generated TypeScript definitions for the wire types
# (`Frame` / `Message` / …) into `sdks/channel-ts/src/generated/`, the
# same surface `aura-channels` used to own. Kept behind a feature so CI /
# release builds don't depend on ts-rs. Enables `aura-model/ts-export` so
# the transitively-referenced `ApprovalDecision` / `ResourceAccess` emit too.
ts-export = ["dep:ts-rs", "aura-model/ts-export"]

[dependencies]
aura-model = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
rmp-serde = { workspace = true }
thiserror = { workspace = true }

# Optional — only pulled in for the `ts-export` feature so that
# release builds don't have to compile ts-rs.
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
