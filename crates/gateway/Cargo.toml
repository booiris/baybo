[package]
name = "aura-gateway"
version.workspace = true
edition.workspace = true

[features]
default = ["linux", "macos"]
# Compile-in Linux-specific code paths (currently: systemd installer). Any
# future Linux-only feature of the gateway should live behind this gate rather
# than introducing a narrower flag — one knob per OS keeps cross-platform
# opt-in/out legible.
linux = []
# Compile-in macOS-specific code paths (currently: launchd installer).
macos = []
# Exposes test helpers to downstream crate-level tests. Never enabled in
# release builds.
test-support = []

[dependencies]
aura-agent = { workspace = true }
aura-channels = { workspace = true }
aura-config = { workspace = true }
aura-cron = { workspace = true }
aura-job = { workspace = true }
aura-llm = { workspace = true }
aura-model = { workspace = true }
aura-pairing = { workspace = true }
aura-security = { workspace = true }
aura-session = { workspace = true }
aura-skills = { workspace = true }
aura-storage = { workspace = true }
aura-tools = { workspace = true }
aura-trace = { workspace = true }
aura-workspace = { workspace = true, features = ["io"] }

anyhow = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
tokio-stream = { workspace = true }
bytes = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
futures = { workspace = true }
axum = { workspace = true, features = ["ws"] }
rmp-serde = { workspace = true }
libc = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace"] }
tower = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
zstd = { workspace = true }
# Runtime dep: sidecar asset install uses NamedTempFile for crash-safe
# atomic writes under the shared user cache dir, so concurrent first-
# installs from two workspaces of the same user can't clobber each
# other's temp file. See `src/sidecar/assets.rs::decompress_to`.
tempfile = { workspace = true }

[build-dependencies]
# build.rs runs `pnpm --filter <sidecar> bundle` (which invokes esbuild)
# to produce a single ESM file per channel-src/* package, hashes the
# inputs, and zstd-compresses each bundle before `include_bytes!`.
sha2 = { workspace = true }
zstd = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
aura-gateway = { workspace = true, features = ["test-support"] }
aura-storage = { workspace = true, features = ["test-support"] }
chrono = { workspace = true }
# rmcp here is dev-only: the SidecarTransport tests need to round-trip
# typed `TxJsonRpcMessage`/`RxJsonRpcMessage` envelopes. Production
# code in this crate only handles opaque `Vec<u8>`, so the runtime
# graph stays free of rmcp.
rmcp = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
