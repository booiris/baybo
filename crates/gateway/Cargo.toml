[package]
name = "baybo-gateway"
version.workspace = true
edition.workspace = true
# See `crates/integration-tests/Cargo.toml` for the rationale: aggregating
# tests/*.rs into one binary saves the per-binary link of the gateway
# graph (200s+ each on debug).
autotests = false

[lib]
doctest = false

[[test]]
name = "all"
path = "tests/all.rs"

[features]
default = ["linux", "macos"]
# Compile-in Linux-specific code paths (currently: systemd installer). Any
# future Linux-only feature of the gateway should live behind this gate rather
# than introducing a narrower flag — one knob per OS keeps cross-platform
# opt-in/out legible.
linux = []
# Compile-in macOS-specific code paths (currently: launchd installer).
macos = []
# Exposes test helpers to downstream crate-level tests. Never enabled in
# release builds. Pulls in `baybo-llm/test-support` so the gateway's own
# test fixtures can construct `BillableLlm::passthrough`.
test-support = ["baybo-llm/test-support"]

[dependencies]
baybo-agent = { workspace = true }
baybo-channels = { workspace = true }
# Cron-fire prompt reverse-parser for the admin chat panel.
baybo-context = { workspace = true }
baybo-config = { workspace = true }
baybo-cron = { workspace = true }
baybo-deck = { workspace = true }
baybo-project = { workspace = true }
baybo-cost = { workspace = true }
device-proto = { workspace = true }
remote-host-protocol = { workspace = true }
baybo-turn = { workspace = true }
baybo-llm = { workspace = true }
baybo-model = { workspace = true }
baybo-query = { workspace = true }
baybo-pairing = { workspace = true }
baybo-security = { workspace = true }
baybo-session = { workspace = true }
baybo-skills = { workspace = true }
baybo-storage = { workspace = true }
baybo-store = { workspace = true }
baybo-tools = { workspace = true }
baybo-trace = { workspace = true }
baybo-workspace = { workspace = true, features = ["io"] }

anyhow = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
# Noise IK responder for the device-content session (transport-wraps the
# channel frame loop). Same major as device-proto so the handshake/transport
# types unify across the two crates.
snow = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
tokio-stream = { workspace = true }
bytes = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
axum = { workspace = true, features = ["ws"] }
# A holds an outbound control WS to the remote host (C); `handshake` is enough
# (the caller dials TCP/TLS and hands us the stream). `connect` + rustls roots
# add the outbound `wss://` client the relay-pairing host manager dials.
tokio-tungstenite = { workspace = true, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
# Pin the process-wide rustls CryptoProvider before the relay wss client dials
# (see GatewayServer::new) — the graph has both aws-lc-rs + ring, so rustls can't
# auto-select and connect_async would panic.
rustls = { workspace = true }
libc = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace"] }
tower = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
zstd = { workspace = true }
# Runtime dep: sidecar asset install uses NamedTempFile for crash-safe
# atomic writes under the shared user cache dir, so concurrent first-
# installs from two workspaces of the same user can't clobber each
# other's temp file. See `src/sidecar/assets.rs::decompress_to`.
tempfile = { workspace = true }

[build-dependencies]
# build.rs runs `pnpm --filter <sidecar> bundle` (which invokes esbuild)
# to produce a single ESM file per sidecars/channel/* package, hashes the
# inputs, and zstd-compresses each bundle before `include_bytes!`.
sha2 = { workspace = true }
zstd = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
baybo-gateway = { workspace = true, features = ["test-support"] }
# `media_probe::fixture`: the ingest probes must be proven against PDFs and
# containers that really parse.
baybo-llm = { workspace = true, features = ["test-support"] }
baybo-security = { workspace = true, features = ["test-support"] }
baybo-storage = { workspace = true, features = ["test-support"] }
baybo-config = { workspace = true }
baybo-context = { workspace = true }
baybo-model = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
# Boot a real remote-host relay (C) in-process for the relay-content e2e harness,
# so the spliced A<->C<->P path is proven across the workspace boundary.
remote-host-relay = { workspace = true }
remote-host-admission = { workspace = true }
