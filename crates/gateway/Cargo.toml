[package]
name = "aura-gateway"
version.workspace = true
edition.workspace = true
# See `crates/integration-tests/Cargo.toml` for the rationale: aggregating
# tests/*.rs into one binary saves the per-binary link of the gateway
# graph (200s+ each on debug).
autotests = false

[lib]
doctest = false

[[test]]
name = "all"
path = "tests/all.rs"

[features]
default = ["linux", "macos"]
# Compile-in Linux-specific code paths (currently: systemd installer). Any
# future Linux-only feature of the gateway should live behind this gate rather
# than introducing a narrower flag — one knob per OS keeps cross-platform
# opt-in/out legible.
linux = []
# Compile-in macOS-specific code paths (currently: launchd installer).
macos = []
# Exposes test helpers to downstream crate-level tests. Never enabled in
# release builds. Pulls in `aura-llm/test-support` so the gateway's own
# test fixtures can construct `BillableLlm::passthrough`.
test-support = ["aura-llm/test-support"]

[dependencies]
aura-agent = { workspace = true }
aura-channels = { workspace = true }
# Cron-fire prompt reverse-parser for the admin chat panel.
aura-context = { workspace = true }
aura-config = { workspace = true }
aura-cron = { workspace = true }
aura-cost = { workspace = true }
aura-goal = { workspace = true }
aura-job = { workspace = true }
aura-llm = { workspace = true }
aura-model = { workspace = true }
aura-query = { workspace = true }
aura-pairing = { workspace = true }
aura-security = { workspace = true }
aura-session = { workspace = true }
aura-skills = { workspace = true }
aura-storage = { workspace = true }
aura-store = { workspace = true }
aura-tools = { workspace = true }
aura-trace = { workspace = true }
aura-workspace = { workspace = true, features = ["io"] }

anyhow = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
tokio-stream = { workspace = true }
bytes = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
futures = { workspace = true }
axum = { workspace = true, features = ["ws"] }
libc = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace"] }
tower = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
zstd = { workspace = true }
# Runtime dep: sidecar asset install uses NamedTempFile for crash-safe
# atomic writes under the shared user cache dir, so concurrent first-
# installs from two workspaces of the same user can't clobber each
# other's temp file. See `src/sidecar/assets.rs::decompress_to`.
tempfile = { workspace = true }

[build-dependencies]
# build.rs runs `pnpm --filter <sidecar> bundle` (which invokes esbuild)
# to produce a single ESM file per channel-src/* package, hashes the
# inputs, and zstd-compresses each bundle before `include_bytes!`.
sha2 = { workspace = true }
zstd = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
aura-gateway = { workspace = true, features = ["test-support"] }
aura-security = { workspace = true, features = ["test-support"] }
aura-storage = { workspace = true, features = ["test-support"] }
aura-config = { workspace = true }
aura-model = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
