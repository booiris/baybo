[package]
name = "aura-cron"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
# Exposes test fixtures (e.g. `NeverShutdown`) to downstream crates' tests.
# Enable via `aura-cron = { workspace = true, features = ["test-support"] }`
# in a dev-dependency. Not enabled by default; production builds never see
# these items.
test-support = []

[dependencies]
aura-model = { workspace = true }

chrono = { workspace = true }
chrono-tz = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
cron = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
