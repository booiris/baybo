[package]
name = "baybo-task"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
# Exposes the in-memory `MemoryTaskStore` fixture to downstream crates' tests.
# Enable via `baybo-task = { workspace = true, features = ["test-support"] }`
# in a dev-dependency. Not enabled by default; production builds never see it.
test-support = []

[dependencies]
baybo-model = { workspace = true }
baybo-store = { workspace = true }
baybo-tools = { workspace = true }

async-trait = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
baybo-workspace = { workspace = true }
tokio-util = { workspace = true }
