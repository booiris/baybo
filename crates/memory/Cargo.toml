[package]
name = "aura-memory"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
test-support = []
# Recall-only memory for the LOCOMO benchmark (`bench/memory`): exposes
# `ReadOnlyMemory`, a wrapper that forwards recall + tools but no-ops the write
# hooks. `aura`'s runtime applies it under the matching feature so the bench can
# drive the real agent (recall live) without QA turns polluting the scope. Not
# a production path.
bench-readonly-memory = []

[dependencies]
aura-model = { workspace = true }
aura-llm = { workspace = true }
aura-tools = { workspace = true }
aura-trace = { workspace = true }
aura-security = { workspace = true }
aura-config = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
serde_json = { workspace = true }
aura-trace = { workspace = true, features = ["test-support"] }
aura-workspace = { workspace = true }
tokio-util = { workspace = true }
tempfile = { workspace = true }
