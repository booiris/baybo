[package]
name = "baybo-memory"
version.workspace = true
edition.workspace = true
autotests = false

[lib]
doctest = false

# Single aggregated integration-test binary: each sibling file is mounted as a
# module so the harness links once instead of per-file, with `common` shared at
# the test-crate root. See `tests/all.rs`.
[[test]]
name = "all"
path = "tests/all.rs"

[features]
test-support = []
# Recall-only memory for the LOCOMO benchmark (`bench/memory`): exposes
# `ReadOnlyMemory`, a wrapper that forwards recall + tools but no-ops the write
# hooks. `baybo`'s runtime applies it under the matching feature so the bench can
# drive the real agent (recall live) without QA turns polluting the scope. Not
# a production path.
bench-readonly-memory = []

[dependencies]
baybo-model = { workspace = true }
baybo-llm = { workspace = true }
baybo-tools = { workspace = true }
baybo-trace = { workspace = true }
baybo-security = { workspace = true }
baybo-config = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
baybo-tools = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
serde_json = { workspace = true }
baybo-trace = { workspace = true, features = ["test-support"] }
baybo-workspace = { workspace = true }
tokio-util = { workspace = true }
tempfile = { workspace = true }
