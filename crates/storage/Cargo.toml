[package]
name = "baybo-storage"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
# Exposes the in-memory `MemoryBlobStore` fake to downstream crates'
# tests (the session fakes live in baybo-session). Pull in via:
#   baybo-storage = { workspace = true, features = ["test-support"] }
# inside the consumer's `[dev-dependencies]`.
test-support = []

[dependencies]
baybo-model = { workspace = true }
baybo-store = { workspace = true }

async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
deadpool-sqlite = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
unicode-normalization = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
tracing = { workspace = true }

[dev-dependencies]
baybo-session = { workspace = true, features = ["test-support"] }
baybo-trace = { workspace = true }
baybo-turn = { workspace = true }
libc = { workspace = true }
tempfile = { workspace = true }
# `test-util` backs `#[tokio::test(start_paused = true)]` in the retry-backoff
# tests; it is NOT part of tokio's `full`, and a `--workspace` build only
# supplies it by feature unification, so `cargo test -p baybo-storage` needs it
# declared here.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
