[package]
name = "aura-config"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
# Compile in the `[sandbox] mode = passthrough` config (disables shell isolation;
# for running aura inside a benchmark container). Off by default — see the root
# crate's `bench-passthrough`.
bench-passthrough = []

[dependencies]
aura-model = { workspace = true }
aura-workspace = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
# Mirror contract tests only. The library has no runtime aura-* dep beyond
# `aura-workspace` (paths only — `default-features = false` keeps the I/O
# layer out of the dep graph).
aura-tools = { workspace = true }
