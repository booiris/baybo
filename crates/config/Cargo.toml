[package]
name = "baybo-config"
version.workspace = true
edition.workspace = true
autotests = false

[lib]
doctest = false

# Single aggregated integration-test binary: each sibling file is mounted as a
# module so the harness links once instead of per-file. See `tests/all.rs`.
[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
baybo-model = { workspace = true }
baybo-workspace = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
# Mirror contract tests only. The library has no runtime baybo-* dep beyond
# `baybo-workspace` (paths only — `default-features = false` keeps the I/O
# layer out of the dep graph).
baybo-tools = { workspace = true }
tempfile = { workspace = true }
