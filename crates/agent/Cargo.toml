[package]
name = "baybo-agent"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
baybo-cron = { workspace = true }
baybo-model = { workspace = true }
baybo-llm = { workspace = true }
baybo-tools = { workspace = true }
baybo-subagent = { workspace = true }
baybo-skills = { workspace = true }
baybo-skills-assessor = { workspace = true }
baybo-workspace = { workspace = true, features = ["io"] }
baybo-context = { workspace = true }
baybo-session = { workspace = true }
baybo-trace = { workspace = true }
baybo-job = { workspace = true }
baybo-memory = { workspace = true }
baybo-cost = { workspace = true }
baybo-security = { workspace = true }
baybo-sandbox = { workspace = true }
baybo-store = { workspace = true }
baybo-storage = { workspace = true }
baybo-channels = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio-util = { workspace = true }
regex = { workspace = true }
chrono-tz = { workspace = true }
futures = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
async-stream = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
baybo-cost = { workspace = true, features = ["test-support"] }
baybo-job = { workspace = true, features = ["test-support"] }
baybo-llm = { workspace = true, features = ["test-support"] }
baybo-memory = { workspace = true, features = ["test-support"] }
baybo-security = { workspace = true, features = ["test-support"] }
baybo-session = { workspace = true, features = ["test-support"] }
baybo-storage = { workspace = true, features = ["test-support"] }
baybo-store = { workspace = true, features = ["test-support"] }
baybo-trace = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
# `test-util` (not in the `full` feature set) for `start_paused` time control
# in the foreground-wait policy tests.
tokio = { workspace = true, features = ["test-util"] }
