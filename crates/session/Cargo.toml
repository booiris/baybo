[package]
name = "aura-session"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
# Exposes the in-memory `MemorySessionStore` / `MemorySessionSummaryStore`
# fakes to downstream crates' tests. Pull in via:
#   aura-session = { workspace = true, features = ["test-support"] }
# inside the consumer's `[dev-dependencies]`.
test-support = []

[dependencies]
aura-model = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
sha2 = { workspace = true }
