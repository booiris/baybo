[package]
name = "aura-context"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
aura-model = { workspace = true }
aura-llm = { workspace = true }
aura-skills = { workspace = true }
aura-session = { workspace = true }
# Subagent profile registry: context resolves a subagent session's system
# prompt from its profile name (see `ContextManager::subagent_profile`).
aura-subagent = { workspace = true }
aura-tools = { workspace = true }
aura-trace = { workspace = true }
# `io` exposes `identity::load_identity_files`, used by prompts::soul to
# assemble the system prompt from the workspace identity files.
aura-workspace = { workspace = true, features = ["io"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tiktoken-rs = { workspace = true }
parking_lot = { workspace = true }
# Used by the fast-path's async `summary.md` read.
tokio = { workspace = true, features = ["fs"] }
# Cancellation tokens: `BACKGROUND_SUMMARY_WAIT_TIMEOUT` cooperates
# with the agent's cancel cascade, and the background-summary tool
# loop hands a token to `aura_tools::ToolContext` so a parent cancel
# kills any in-flight `Read`/`Edit` along with the LLM call.
tokio-util = { workspace = true }
# Owner token for `session_summaries.in_flight_owner` minted by the
# trigger gate so a stale Pass A finishing after Pass B remarked the
# parent cannot CAS-clear Pass B's mark.
uuid = { workspace = true }
# Content-addressed tool-output spill files (`prompts::tool_output`).
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
aura-storage = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
# `test-util` enables `tokio::time::pause` / `start_paused = true`
# attribute used by the wrapper's `wait_for_in_flight` tests so the
# 15s wall-clock timeout stays virtual.
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber = { workspace = true }
