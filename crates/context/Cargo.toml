[package]
name = "aura-context"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
aura-model = { workspace = true }
aura-llm = { workspace = true }
aura-skills = { workspace = true }
aura-session = { workspace = true }
aura-trace = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tiktoken-rs = { workspace = true }
parking_lot = { workspace = true }
# Used by `FsSummaryLoader` for async file reads inside the
# compression-time fast-path. Filesystem-trait stays in this crate
# (the trait is the abstraction); `aura-workspace` deps stay one
# layer up at the bootstrap site.
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
aura-storage = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true }
