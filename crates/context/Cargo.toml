[package]
name = "aura-context"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
aura-model = { workspace = true }
aura-llm = { workspace = true }
aura-skills = { workspace = true }
aura-session = { workspace = true }
aura-trace = { workspace = true }
aura-workspace = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tiktoken-rs = { workspace = true }
parking_lot = { workspace = true }
# Used by the fast-path's async `summary.md` read.
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
aura-storage = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
# `test-util` enables `tokio::time::pause` / `start_paused = true`
# attribute used by the wrapper's `wait_for_in_flight` tests so the
# 15s wall-clock timeout stays virtual.
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber = { workspace = true }
