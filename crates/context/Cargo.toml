[package]
name = "baybo-context"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
baybo-model = { workspace = true }
baybo-llm = { workspace = true }
baybo-skills = { workspace = true }
baybo-session = { workspace = true }
# Subagent profile registry: context resolves a subagent session's system
# prompt from its profile name (see `ContextManager::subagent_profile`).
baybo-subagent = { workspace = true }
baybo-tools = { workspace = true }
baybo-trace = { workspace = true }
# `io` exposes `identity::load_identity_files`, used by prompts::soul to
# assemble the system prompt from the workspace identity files.
baybo-workspace = { workspace = true, features = ["io"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tiktoken-rs = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
# Cancellation tokens: the background-summary tool loop hands a token
# to `baybo_tools::ToolContext` so a parent cancel kills any in-flight
# `Read`/`Edit` along with the LLM call.
tokio-util = { workspace = true }
# Per-run identifiers in the session log (`session_log.rs`).
uuid = { workspace = true }
# Content-addressed tool-output spill files (`prompts::tool_output`).
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
# Pulls the in-memory `MemorySessionStore` / `MemorySessionSummaryStore`
# fakes the context unit tests build their `SessionManager` from.
baybo-session = { workspace = true, features = ["test-support"] }
baybo-storage = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true }
