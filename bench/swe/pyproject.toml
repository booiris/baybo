# Persistent, uv-managed Python environment for the SWE-bench harness tooling
# (the `swebench` grader/image-builder + `swe_export.py`). A member of the bench/
# uv workspace (../pyproject.toml): `uv sync` provisions a pinned CPython and the
# reused on-disk `bench/.venv`, independent of whatever
# `python3` the host ships — never `pip install` into the system interpreter.
# This is a deps-only env (`package = false`), not an installable package.
[project]
name = "baybo-bench-swe-pytools"
version = "0.0.0"
description = "Python tooling for the baybo SWE-bench harness: dataset export + the swebench grader/image builder."
# swebench's stack (datasets/pyarrow/...) lags the newest CPython; pin a known-good line.
requires-python = ">=3.11,<3.13"
dependencies = [
    "swebench",
]

[tool.uv]
package = false
