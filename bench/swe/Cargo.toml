# SWE-bench benchmark. NOT shipped and NOT on the CI/`cargo test` path: the
# `run` bin starts Docker containers, drives a real `aura` against a model API
# (spends money), and shells out to the `swebench` Python harness for grading.
# Run it by hand. The library half (IR + pure helpers + report) is unit-tested
# and has no Aura/Docker/Python dependency.
[package]
name = "aura-bench-swe"
version.workspace = true
edition.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "run"
path = "src/bin/run.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
