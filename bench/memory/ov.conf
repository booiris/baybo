{
    "server": {
        "host": "0.0.0.0",
        "port": 1933,
        "auth_mode": "api_key",
        "root_api_key": "${OPENVIKING_API_KEY}",
        "cors_origins": ["*"]
    },
    "storage": {
        "workspace": "/app/.openviking/data",
        "vectordb": {
            "name": "context",
            "backend": "local",
            "project": "default"
        },
        "agfs": {
            "backend": "local",
            "timeout": 10
        }
    },
    "embedding": {
        "dense": {
            "provider": "openai",
            "model": "${OPENVIKING_EMBEDDING_MODEL}",
            "api_base": "${OPENVIKING_EMBEDDING_URL}",
            "api_key": "${OPENVIKING_EMBEDDING_API_KEY}",
            "dimension": "${OPENVIKING_EMBEDDING_DIMS}",
            "input": "text"
        },
        "text_source": "content_only",
        "max_input_tokens": 4096
    },
    "vlm": {
        "provider": "openai",
        "model": "${OPENVIKING_VLM_MODEL}",
        "api_base": "${OPENVIKING_VLM_API_BASE}",
        "api_key": "${DEEPSEEK_API_KEY}",
        "temperature": 0.0,
        "max_retries": 2,
        "thinking": false
    }
}
