name: baybo

services:
  baybo:
    image: ${BAYBO_IMAGE:-baybo:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${BAYBO_HTTP_PORT:-8888}:8888"
    environment:
      BAYBO_CONFIG_PATH: /var/lib/baybo/config/baybo.json
      BAYBO_WORKSPACE: /var/lib/baybo
      BAYBO_GATEWAY_PORT: "8888"
      BAYBO_LLM_API_KEY: ${BAYBO_LLM_API_KEY:?set BAYBO_LLM_API_KEY in deploy/docker/.env}
      BAYBO_LLM_NAME: ${BAYBO_LLM_NAME:-primary}
      BAYBO_LLM_PROVIDER: ${BAYBO_LLM_PROVIDER:-deepseek}
      BAYBO_LLM_MODEL: ${BAYBO_LLM_MODEL:-deepseek-chat}
      BAYBO_LLM_BASE_URL: ${BAYBO_LLM_BASE_URL:-}
      BAYBO_REASONING_EFFORT: ${BAYBO_REASONING_EFFORT:-medium}
      BAYBO_PERMISSION: ${BAYBO_PERMISSION:-auto}
      BAYBO_BROWSER_ENABLE: ${BAYBO_BROWSER_ENABLE:-false}
      RUST_LOG: ${RUST_LOG:-baybo=info}
    volumes:
      - baybo-data:/var/lib/baybo
      - baybo-cache:/var/cache/baybo
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    shm_size: 1gb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8888/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

volumes:
  baybo-data:
    name: ${BAYBO_DATA_VOLUME:-baybo-data}
  baybo-cache:
    name: ${BAYBO_CACHE_VOLUME:-baybo-cache}
