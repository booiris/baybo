# Pin the workspace formatting heuristics so line wrapping does not drift
# when rustfmt defaults change across toolchain updates.
max_width = 100
use_small_heuristics = "Default"
fn_call_width = 60
attr_fn_like_width = 70
struct_lit_width = 18
struct_variant_width = 35
array_width = 60
chain_width = 60
single_line_if_else_max_width = 50
short_array_element_width_threshold = 10
