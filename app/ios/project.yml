# The hand-written Xcode project (xcodegen spec) for the SwiftUI Baybo app.
# Regenerate with `xcodegen generate` (or scripts/build-app.sh, which also builds
# the Rust core first — the Generated/ + Externals/ inputs below come from
# scripts/build-core.sh).
#
# CONTINUITY CONTRACT with already-shipped installs — do not change any of
# these or existing users silently lose their device identity, pairing, and
# push key:
#   * bundle ids: com.baybo.app + com.baybo.app.NotificationExtension
#   * DEVELOPMENT_TEAM KLK5BP5YS6 (the App-Identifier prefix)
#   * keychain-access-groups: $(AppIdentifierPrefix)com.baybo.app must stay the
#     FIRST (and only) entry — five "private" keychain items live in the
#     default group, which is the first entitlement entry
#   * app group group.com.baybo.app (declared on both targets; carries no data
#     today, kept as cheap insurance)
#   * NSE Info.plist key BayboKeychainAccessGroup (PushKeyStore reads the
#     access group from it at runtime)
name: Baybo
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: KLK5BP5YS6
    CODE_SIGN_STYLE: Automatic
    # One source of truth for both the signed entitlement and the runtime APNs
    # route. Local/debugging exports use development even when optimized
    # (`Release`); distribution builds override this to production.
    BAYBO_APNS_ENVIRONMENT: development
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    ARCHS: arm64
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
# One explicit shared scheme so Xcode's Run button always targets the app —
# without it Xcode auto-creates a scheme per target, and picking the
# NotificationExtension one makes Run ask "choose an app to run" (an extension
# needs a host). The NSE builds via the app's target dependency.
schemes:
  Baybo:
    build:
      targets:
        Baybo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BayboTests
        - BayboUITests
    profile:
      config: Release
    archive:
      config: Release
targets:
  Baybo:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/transcript/**"
      - path: Generated/BayboCore.swift
        createIntermediateGroups: false
      # Shared with the NSE target: the userInfo keys the NSE writes after
      # decrypting a push preview and the app's tap handler reads back.
      - path: NotificationExtension/PushPayloadKeys.swift
        createIntermediateGroups: false
      # The transcript web bundle (built by `pnpm build` in web/, copied here by
      # scripts/build-app.sh) ships as a folder reference so index.html + hashed
      # assets load via loadFileURL.
      - path: App/Resources/transcript
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Externals/BayboCore.xcframework
        embed: false
      - target: NotificationExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baybo.app
        PRODUCT_NAME: Baybo
        TARGETED_DEVICE_FAMILY: "1,2"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Baybo
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "0.1.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Baybo uses the camera to scan the pairing QR code."
        # Required by the image viewer's share sheet: without it, tapping "Save
        # Image" TERMINATES the app (add-only access still needs a purpose string).
        NSPhotoLibraryAddUsageDescription: "Baybo saves a chat image to your photo library when you share it there."
        # Chat audio (AudioPlayerCenter) keeps playing through lock/background;
        # Now Playing + remote commands give it the Control Center transport.
        UIBackgroundModes:
          - audio
        BayboKeychainAccessGroup: "$(AppIdentifierPrefix)com.baybo.app"
        BayboApnsEnvironment: "$(BAYBO_APNS_ENVIRONMENT)"
        # Space Mono (OFL, App/Resources/Fonts) — the style guide's chrome face.
        UIAppFonts:
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
    entitlements:
      path: App/Baybo.entitlements
      properties:
        aps-environment: "$(BAYBO_APNS_ENVIRONMENT)"
        com.apple.security.application-groups:
          - group.com.baybo.app
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.baybo.app"
  # The unit bundle (swift-testing; XCTest stays for the UI smokes below —
  # swift-testing has no UI-testing API). HOSTED in the app, never hostless:
  #   * the xcframework wraps a STATIC lib already linked into the app, so a
  #     hostless bundle would link a SECOND copy of the Rust core (and boot a
  #     second tokio runtime); hosted resolves it through `-bundle_loader`;
  #   * `Lang` resolves strings through `Bundle.main` — hostless that is the
  #     xctest runner, so every `Lang.t(key)` silently returns the key;
  #   * `PushKeyStore` reads `BayboKeychainAccessGroup` from the host Info.plist;
  #   * everything in App/ is @MainActor over UIKit/WebKit anyway.
  BayboTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # The NSE's decrypt path, compiled straight into the test bundle: an app
      # EXTENSION cannot host a test bundle, so `@testable import
      # NotificationExtension` is not a shape that exists. The three files are
      # self-contained (CryptoKit / Security / Foundation), and until this
      # target existed `NotificationServiceTests` was in the NSE's `excludes:`
      # — compiled by NO target, so its pinned AEAD vector never ran.
      - path: NotificationExtension/NotificationService.swift
        createIntermediateGroups: false
      - path: NotificationExtension/PushKeyStore.swift
        createIntermediateGroups: false
      - path: NotificationExtension/PushPayloadKeys.swift
        createIntermediateGroups: false
    dependencies:
      - target: Baybo
      # Header/module search paths only (`link: false`): the static core is
      # already inside the host binary, and `@testable import Baybo` has to be
      # able to load the `BayboCoreFFI` clang module the app's swiftmodule
      # imports.
      - framework: Externals/BayboCore.xcframework
        embed: false
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baybo.app.Tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Baybo
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Baybo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Baybo"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # Headless interaction smokes (`xcodebuild test` on a sim) for flows that a
  # static `-baybo-*` screenshot can't prove — gesture/tap sequences like the
  # logout-confirm dismiss-and-reopen loop.
  BayboUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Baybo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baybo.app.UITests
        TEST_TARGET_NAME: Baybo
        GENERATE_INFOPLIST_FILE: YES
  NotificationExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationExtension
    dependencies:
      - sdk: UserNotifications.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baybo.app.NotificationExtension
        PRODUCT_NAME: NotificationExtension
        SKIP_INSTALL: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: NO
    info:
      path: NotificationExtension/Info.plist
      properties:
        CFBundleDisplayName: Baybo
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).NotificationService"
        BayboKeychainAccessGroup: "$(AppIdentifierPrefix)com.baybo.app"
    entitlements:
      path: NotificationExtension/NotificationExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.baybo.app
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.baybo.app"
