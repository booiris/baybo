# iOS companion ("P" in the mobile design) — a SEPARATE Cargo workspace (the
# root `[workspace]` excludes it) so the host `cargo clippy --all` gate never
# tries to build an iOS/Tauri-configured crate for the host. It path-depends on
# the two shared crates (`wire`, `device-proto`), which are the
# single source of truth for the wire protocol + crypto — interop with the
# gateway is guaranteed by construction.
#
# `core/` (baybo-mobile-core) is FFI-free and host-testable; the Tauri shell
# (src-tauri) and the NSE target layer on top later. See
# docs/todo/mobile/phase1.md.
[workspace]
resolver = "2"
members = ["core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
baybo-mobile-core = { path = "core" }
wire = { path = "../../../crates/wire" }
device-proto = { path = "../../../crates/device-proto" }
baybo-model = { path = "../../../crates/model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
# Same major as device-proto's snow so the handshake/transport types
# unify across the two crates.
snow = "0.9"
tokio = { version = "1", features = ["rt", "macros"] }
# The Tauri shell dials the gateway's /v1/device/pair WS (ws:// or wss://).
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-barcode-scanner = "2"
# iOS-only: writing the push key to the shared App Group keychain (SecItemAdd).
core-foundation = "0.10"
core-foundation-sys = "0.8"
# iOS-only: provisional notification auth + remote-notification registration.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSError"] }
objc2-ui-kit = { version = "0.3", features = ["UIApplication"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationSettings"] }
block2 = "0.6"
