# iOS companion ("P" in the mobile design) — a SEPARATE Cargo workspace (the
# root `[workspace]` excludes it) so the host `cargo clippy --all` gate never
# tries to build an iOS/Tauri-configured crate for the host. It path-depends on
# the two shared crates (`aura-wire`, `aura-device-proto`), which are the
# single source of truth for the wire protocol + crypto — interop with the
# gateway is guaranteed by construction.
#
# `core/` (aura-mobile-core) is FFI-free and host-testable; the Tauri shell
# (src-tauri) and the NSE target layer on top later. See
# docs/todo/mobile/phase1.md.
[workspace]
resolver = "2"
members = ["core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
aura-mobile-core = { path = "core" }
aura-wire = { path = "../../../crates/aura-wire" }
aura-device-proto = { path = "../../../crates/aura-device-proto" }
aura-model = { path = "../../../crates/model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
# Same major as aura-device-proto's snow so the handshake/transport types
# unify across the two crates.
snow = "0.9"
tokio = { version = "1", features = ["rt", "macros"] }
# The Tauri shell dials the gateway's /v1/device/pair WS (ws:// or wss://).
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-barcode-scanner = "2"
