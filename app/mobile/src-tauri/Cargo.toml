[package]
name = "baybo-mobile-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Baybo iOS companion (Tauri shell)"

# The library Tauri's mobile entry point links against. `staticlib`/`cdylib` are
# required by the iOS/Android build; `rlib` keeps it usable from the desktop bin.
[lib]
name = "baybo_mobile_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
log = { workspace = true }
tauri-plugin-log = { workspace = true }
baybo-mobile-core = { workspace = true }
device-proto = { workspace = true }
remote-host-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "macros", "sync", "fs", "io-util"] }
tokio-tungstenite = { workspace = true }
# Selects + installs the rustls crypto provider for tokio-tungstenite's wss
# dials (see run() in lib.rs); tokio-tungstenite itself pulls rustls with no
# provider, so the first dial would otherwise panic.
rustls = { workspace = true }

# The camera/barcode + haptics plugins only exist on mobile; on desktop the
# crates are empty.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-barcode-scanner = { workspace = true }
tauri-plugin-haptics = { workspace = true }

# The App Group keychain write (push-key persistence for the NSE) is iOS-only,
# as is push registration (notification auth + remote-notification token).
[target.'cfg(target_os = "ios")'.dependencies]
core-foundation = { workspace = true }
core-foundation-sys = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-ui-kit = { workspace = true }
objc2-user-notifications = { workspace = true }
objc2-core-foundation = { workspace = true }
dispatch2 = { workspace = true }
block2 = { workspace = true }
