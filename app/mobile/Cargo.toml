# iOS companion ("P" in the mobile design) — a SEPARATE Cargo workspace (the
# root `[workspace]` excludes it) so the host `cargo clippy --all` gate never
# tries to build an iOS/Tauri-configured crate for the host. It path-depends on
# the two shared crates (`wire`, `device-proto`), which are the
# single source of truth for the wire protocol + crypto — interop with the
# gateway is guaranteed by construction.
#
# `core/` (baybo-mobile-core) is FFI-free and host-testable; the Tauri shell
# (src-tauri) and the NSE target layer on top later. See
# docs/todo/mobile/phase1.md.
[workspace]
resolver = "2"
members = ["core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
baybo-mobile-core = { path = "core" }
wire = { path = "../../crates/wire" }
device-proto = { path = "../../crates/device-proto" }
# The remote-host (C) wire contract: the app uses its relay route/URL builders
# instead of hand-writing /pair/join + /content/join.
remote-host-protocol = { path = "../../remote-host/crates/protocol" }
baybo-model = { path = "../../crates/model" }
serde = { version = "1", features = ["derive"] }
# Optional: ts-rs codegen for the Tauri IPC types (off by default so iOS/release
# builds never compile it). Same pin as the root workspace.
ts-rs = { version = "11", features = ["serde-compat", "no-serde-warnings"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
# Client-minted relay chat-session ids (the relay leg needs no gateway pre-registration).
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls-no-provider",
] }
# Same major as device-proto's snow so the handshake/transport types
# unify across the two crates.
snow = "0.9"
tokio = { version = "1", features = ["rt", "macros"] }
# The Tauri shell dials the gateway's /v1/device/pair WS (ws:// or wss://).
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# tokio-tungstenite pins rustls with default-features off, so NO crypto provider
# is selected — the first wss dial would panic building its ClientConfig. Pull
# rustls directly with exactly one provider (ring: light, and cross-compiles
# cleanly for iOS device + simulator) and install it at startup (src-tauri run()).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = "0.3"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-barcode-scanner = "2"
tauri-plugin-haptics = "2"
# iOS-only: writing the push key to the shared App Group keychain (SecItemAdd).
core-foundation = "0.10"
core-foundation-sys = "0.8"
# iOS-only: provisional notification auth + remote-notification registration.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSError"] }
objc2-ui-kit = { version = "0.3", features = ["UIApplication"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationSettings"] }
block2 = "0.6"
