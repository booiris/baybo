name: CI

# PRs, plus master — and master is here for the CACHE, not for a second opinion.
#
# A run may restore caches from its own ref's scope or from the DEFAULT
# branch's, and nothing else. While CI ran on PRs only, every cache lived under
# `refs/pull/N/merge`, master's scope stayed permanently empty, and so the first
# run of every new PR was cold: measured on PR #239, cargo test 19m47s, ts-rs
# bindings 15m45s, clippy 10m34s — ~48 billed minutes rebuilding the same deps
# in four separate target dirs. (`[profile.dev.package."*"] opt-level = 2` is
# what makes a cold dep build that expensive; see the `test` job.)
#
# One run per merge to master populates that scope, so every PR afterwards
# starts warm — and the master run is itself warm from the previous one, so the
# steady-state cost of this line is a few minutes, not another 48. Only the
# jobs whose caches PRs actually reuse run on push; the path-filtered and
# `if: false` ones below stay PR-only.
#
# The other half is `cache-save-if` on each rust job: master WRITES, a PR only
# restores. A PR-scoped cache is unreadable by any other PR, so writing one buys
# nothing the next PR can use — and the repo-wide budget is 10 GB, which seven
# PR scopes of these target dirs had already overrun (10.10 GB measured), so
# those writes were evicting each other and would evict master's copy too.
#
# What that costs, stated plainly rather than sold as free: a PR gives up its own
# incrementality. rust-cache's key hashes every manifest, so a PR that adds a
# dependency misses master's exact key and lands on the prefix restore — it keeps
# master's dep artifacts but rebuilds the new subtree. That used to be paid once
# (push 1 saved a PR-scoped entry, later pushes hit it exactly); now every push
# re-pays it. Bounded, but this repo's dev branch takes dozens of pushes per PR.
# The narrower gate, if it ever matters, is to let a PR save only when it touched
# a manifest. The pnpm cache is not covered by any of this: `actions/setup-node`
# has no save-if, so a PR whose pnpm-lock.yaml differs from master's still gets a
# full miss (it passes no restore-keys) and still writes its own ~81 MB entry.
#
# The per-job `if` names its event explicitly instead of testing `draft` alone.
# That is not decoration: comparing mixed types, GitHub casts BOTH null and
# false to 0, so on a push — where `github.event.pull_request` is null —
# `draft == false` is already TRUE. Every guard here would have flipped on the
# day this trigger landed, silently, including the ones that must not.
#
# Draft PRs still fire opened/synchronize, but the per-job `if` skips them (a
# skipped job spins up no runner → zero billed minutes); marking a PR "Ready
# for review" fires ready_for_review and lets CI through.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]

# Newer pushes to a PR cancel that PR's in-flight run. Keyed by ref, so a master
# run and a PR run never cancel each other.
#
# Master runs are NOT cancelled, because master is the only ref that writes the
# cache (see `on:`) and rust-cache saves in a post step — a cancelled run leaves
# nothing behind, and nothing here watches master's checks, so it would fail
# silently. This repo pushes to master in bursts (`ec778618`→`03ed8ec6` 135s
# apart, `9a5176d9`→`0d2b6504` 11s), every gap far inside a cold build, so
# cancelling would have meant only the last push of a burst ever warmed anything.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The repo's .cargo/config.toml pins sccache as the rustc wrapper; stock
  # GitHub runners don't have it, and the toolchain action handles caching.
  RUSTC_WRAPPER: ""
  # Also clears the `[target.x86_64-unknown-linux-gnu] rustflags` array in
  # .cargo/config.toml, because an empty-but-SET RUSTFLAGS still shadows it —
  # that array carries a `--remap-path-prefix=/data=...` that means nothing on
  # a runner. The lld link-arg it also carries is worth keeping, so the jobs
  # that actually link re-add it themselves (linking with GNU bfd instead of
  # lld measured ~8x slower on this workspace's objects).
  RUSTFLAGS: ""

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v4
      # Channel + components come from rust-toolchain.toml; this action
      # reads it and caches the cargo registry/target.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        # Master writes the cache, a PR only restores it — see the `on:` note.
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    # The Rust jobs carry no TS toolchain, and `baybo-gateway`'s build script
    # otherwise hard-fails when it cannot compile the embedded dashboard. The
    # `frontend` job below is what gates `app/web` — it installs pnpm and runs
    # the very same `pnpm --filter baybo-web build`.
    env:
      BAYBO_SKIP_WEBUI: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        # Master writes the cache, a PR only restores it — see the `on:` note.
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo clippy --all --benches --tests --examples --all-features --locked -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    # Without this the job inherits GitHub's 6-HOUR default, and a single hung
    # test burns all 360 minutes before the runner is reclaimed — which is what
    # `chat_api::chat_search_finds_a_chinese_word_inside_a_han_run` did on PR
    # #234 (3000/3001 tests green, one test `SLOW [>21120.000s]`, job killed at
    # the ceiling and reported `cancelled`, not `failure`). This repo runs CI on
    # PRs only, so that is a bill worth capping.
    #
    # A hung *test* is no longer what this cap catches: `.config/nextest.toml`
    # terminates any test still running at 4 x 30s, which fails the run in two
    # minutes with the offender named. What is left for this line to bound is a
    # cold-cache build, and that got much more expensive when `[profile.dev
    # .package."*"] opt-level = 2` landed — deps are compiled once and then
    # executed by 3000+ tests, which is the trade. On a `No cache found` run
    # (4-vCPU runner) 468 dep units took >14m43s and had not reached the
    # workspace crates or the 56 test-binary links, so 15 could never pass cold.
    # A warm run pays none of that (the suite itself is 3.3s), so 40 is a
    # runaway backstop, not a target — if a *warm* run approaches it, something
    # is wrong, so investigate rather than bumping the line again.
    timeout-minutes: 40
    env:
      BAYBO_SKIP_WEBUI: 1
      # This job links 56 test binaries; lld does that ~8x faster than the
      # default GNU bfd. Installed by the apt step below.
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        # Master writes the cache, a PR only restores it — see the `on:` note.
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@nextest
      # The grep builtin shells out to ripgrep, so its tests need `rg` on PATH.
      # (The tmux render/smoke tests are `#[ignore]` and run in `render-tests`
      # below; docker- and bwrap-backed tests still self-skip on stock runners.)
      # `lld` backs the RUSTFLAGS link-arg above and must land before cargo runs.
      - run: sudo apt-get update -qq && sudo apt-get install -y ripgrep lld
      # nextest runs every test as its own process in one shared pool, instead
      # of cargo's serial-per-binary execution. Doctests are disabled
      # workspace-wide, so nextest not running them changes no coverage.
      - run: cargo nextest run --workspace --locked

  # Detects which expensive, path-scoped stacks this PR touches, so the jobs
  # below can be skipped entirely — a skipped job spins up no runner, so a PR
  # that touches neither the TUI nor the iOS app pays zero minutes for both.
  # This matters most for `ios-sim`: macOS runners bill at 10x.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    outputs:
      render: ${{ steps.filter.outputs.render }}
      ios: ${{ steps.filter.outputs.ios }}
      ios_native: ${{ steps.filter.outputs.ios_native }}
    steps:
      # Full history so the merge-base diff against the PR base resolves.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Plain git (needs only `contents: read`).
      - id: filter
        run: |
          changed() { git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE "$1"; }

          # The render stack (tui / term-harness).
          if changed '^crates/(tui|term-harness)/'; then
            echo "render=true" >> "$GITHUB_OUTPUT"
          else
            echo "render=false" >> "$GITHUB_OUTPUT"
          fi

          # `app/ios` is its own cargo workspace, but it PATH-DEPENDS on
          # crates/{wire,device-proto,model} and remote-host/ — so a root-crate
          # change can break the iOS build without touching app/ios at all.
          # Miss those prefixes and the iOS gate has a hole exactly where the
          # gateway/app wire contract lives. docs/openapi.json is here for the
          # same reason, one hop further out: the transcript bundle's
          # restSentinel.ts pins `TranscriptRowItem` to app/web's generated
          # schema, which is generated from that spec — so a gateway-side rename
          # of a `ChatTranscriptItem` field must reach this job. Note nothing
          # gates the freshness of app/web's committed schema against the spec;
          # its `gen:api` overwrites it in the runner and diffs nothing.
          IOS_DEPS='^(app/ios/|crates/(wire|device-proto|model)/|remote-host/|docs/openapi\.json)'
          if changed "$IOS_DEPS"; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

          # A Mac is needed only for the Swift/Xcode half. A change confined to
          # app/ios docs (CLAUDE.md) leaves ios_native false and skips the 10x
          # runner entirely.
          if changed "^app/ios/(App/|UITests/|Tests/|NotificationExtension/|project\.yml|scripts/|web/|ffi/|bindgen/|Cargo\.)|^crates/(wire|device-proto|model)/|^remote-host/"; then
            echo "ios_native=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios_native=false" >> "$GITHUB_OUTPUT"
          fi

  # The tmux-driven render/smoke tests are flaky under load, so they're
  # `#[ignore]` and run here out of the gating `test` job. Gated on `changes`:
  # only runs when the render stack (tui / term-harness) is actually touched.
  # Non-blocking (`continue-on-error`): a render regression is surfaced but
  # doesn't wedge merges on the known cursor-position race. The in-process
  # `static SERIAL` mutex serializes the tui scenarios; `chat_render`'s 8
  # internal retries absorb the race.
  render-tests:
    name: tmux render tests (non-gating)
    needs: changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.changes.outputs.render == 'true' }}
    continue-on-error: true
    env:
      # See the `test` job: lld links this workspace far faster than GNU bfd.
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        # This job is PR-only, so the flag makes its cache write-never rather
        # than master-only: rust-cache puts the JOB ID in the key, so a
        # `render-tests` entry is unreadable by `test` (and vice versa), and
        # master never runs this job to populate one. Writing it would spend the
        # shared 10 GB budget on bytes only later pushes of the SAME PR could
        # read — and evict a master entry to do it. The job is non-gating and
        # only fires when crates/tui|term-harness moved, so cold is the cheaper
        # trade. To make it warm instead, give it and `test` the same
        # `cache-shared-key` (their env hash already matches) so master's `test`
        # run populates the entry this job restores.
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: sudo apt-get update -qq && sudo apt-get install -y tmux lld
      - run: cargo test -p baybo-tui --test chat_render --locked -- --include-ignored
      - run: cargo test -p baybo-term-harness --lib --locked -- --include-ignored

  ts-bindings:
    name: ts-rs bindings sync
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        # Master writes the cache, a PR only restores it — see the `on:` note.
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: scripts/check-ts-bindings.sh

  frontend:
    name: frontend (typecheck + build + test)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: the sidecars import @baybo/channel-sdk, and the
      # sidecars/channel/* test suites import from the gitignored dist/, so the
      # SDK's .d.ts and each package's dist/ must exist before typecheck and
      # test. pnpm builds in dependency order; this also builds the web
      # dashboard (gen:api + tsc -b + vite build).
      - run: pnpm -r --if-present run build
      # The build's `gen:api` step regenerates app/web/src/api/schema.d.ts from
      # docs/openapi.json IN PLACE, so a stale committed client is silently
      # overwritten here and would never be noticed. `openapi_json_is_in_sync`
      # (cargo test) gates the spec against the Rust routes; this gates the
      # generated client against the spec. Without it the two ends are checked
      # and the middle is not.
      - name: schema.d.ts matches docs/openapi.json
        run: |
          if ! git diff --exit-code -- app/web/src/api/schema.d.ts; then
            echo
            echo "[!] app/web/src/api/schema.d.ts is stale against docs/openapi.json."
            echo "[!] Fix: pnpm --filter baybo-web gen:api && commit the result."
            exit 1
          fi
      # eslint gates app/web on the wiring-bug class tsc + the vitest reducers
      # can't see (strict-boolean-expressions, no-unnecessary-condition,
      # react-hooks); the existing backlog is tracked in
      # app/web/eslint-suppressions.json, so only NEW violations fail here.
      - run: pnpm --filter baybo-web lint
      # tsc --noEmit across the channel SDK + channel/tool sidecars
      - run: pnpm -r --if-present run check
      # node --test suites (channel SDK, channel + browser sidecars)
      - run: pnpm -r --if-present run test

  # ---------------------------------------------------------------------------
  # iOS. The app lives in two islands the jobs above deliberately cannot see:
  # `app/ios` is its own cargo workspace (the root one EXCLUDES it, so its unit
  # tests had never run anywhere but a laptop) and `app/ios/web` is its own pnpm
  # workspace (`packages: []`, so the root `frontend` job never adopts it).
  #
  # Three jobs, split by what each one costs, because cost is what decides which
  # of them run: the transcript bundle needs neither Rust nor a Mac (`ios-web`,
  # ~2 min at 1x, ON), the app's own cargo workspace needs Rust but no Mac
  # (`ios-core`, 1x but slow, OFF), and only the Swift/Xcode half needs a Mac
  # (`ios-sim`, 10x, OFF). While the latter two are off, nothing under app/ios
  # is covered except the transcript bundle — say so in the PR body rather than
  # letting a green tick imply more.
  # ---------------------------------------------------------------------------

  # The cheapest third of the iOS suite: no Rust toolchain, no Mac, ~2 min on a
  # 1x runner. It was originally disabled as collateral damage — it shared a job
  # with the cargo half below, which is what actually ate the budget.
  #
  # It also carries the two compile-time drift sentinels, which is why running
  # it matters beyond this bundle: `src/wireSentinel.ts` pins the hand-written
  # frame mirrors to the ts-rs contract in crates/wire, and `src/restSentinel.ts`
  # pins `TranscriptRowItem` to the gateway's `ChatTranscriptItem` via
  # docs/openapi.json. Both are `tsc --noEmit` assertions with no runtime
  # component, so this job is the only thing anywhere that evaluates them.
  # OFF ONLY BECAUSE THE ACTIONS QUOTA IS EXHAUSTED — not because it is slow, not
  # because it is flaky, and not for the reason the two jobs below are off. This
  # is the cheap one. To turn it back on, replace the `if: false` with the gate
  # kept below it; nothing else needs changing.
  #
  # What stays unenforced meanwhile: both `tsc --noEmit` sentinels. Neither has a
  # runtime component, so no other job anywhere evaluates them — a PR that adds a
  # field to `ChatTranscriptItem` and forgets the iOS mirror goes green.
  ios-web:
    name: iOS transcript bundle (lint + test + build)
    needs: changes
    runs-on: ubuntu-latest
    if: false
    # if: ${{ github.event.pull_request.draft == false && needs.changes.outputs.ios == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/ios/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app/ios/web
      # eslint gates the wiring-bug class tsc + the pure-reducer suite can't see
      # (strict-boolean-expressions, no-unnecessary-condition, react-hooks); the
      # existing backlog is tracked in app/ios/web/eslint-suppressions.json, so
      # only NEW violations fail. Mirrors the root frontend job's lint step.
      - run: pnpm lint
        working-directory: app/ios/web
      # vitest over the transcript reducers — the sync cursor, the work-block
      # folds, and the cross-session bridge isolation.
      - run: pnpm test
        working-directory: app/ios/web
      # `pnpm build` is `tsc --noEmit && vite build`, and the typecheck is the
      # point: it is what evaluates both drift sentinels.
      - run: pnpm build
        working-directory: app/ios/web

  # STILL DISABLED — this half is what exhausted the Actions budget: a cold
  # `cargo clippy --all-targets --all-features` plus `nextest` over app/ios's
  # own ~286-crate workspace, which shares no cache with the root one, is
  # ~15-25 min of 1x runner per cold PR (the setup-rust-toolchain cache only
  # helps once the key is warm, and it re-cold-starts on any Cargo.lock or
  # toolchain move). Turning it back on means paying that on every PR that
  # touches app/ios/, crates/{wire,device-proto,model}/ or remote-host/.
  # To restore, put the original gate back:
  #   if: ${{ github.event.pull_request.draft == false && needs.changes.outputs.ios == 'true' }}
  ios-core:
    name: iOS core (rust)
    needs: changes
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      # No toolchain file under app/ios — rustup walks UP to the root
      # rust-toolchain.toml, so this is the same channel as every other job.
      # cache-workspaces is not optional: app/ios has its own target dir and
      # shares nothing with the root workspace's cache.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: app/ios
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all --check
        working-directory: app/ios
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        working-directory: app/ios
      - run: cargo nextest run --workspace --locked
        working-directory: app/ios

  ios-sim:
    name: iOS app (build + unit tests; UI smokes non-gating)
    needs: changes
    # NOT macos-latest — that label still maps to macos-15, whose simulator set
    # is iOS 18.x + a churning 26.0/26.1; the deployment target is 18.0 now, but
    # the app must keep building against the CURRENT SDK (glassSurface's iOS 26
    # branch) and testing on a stable 26.x runtime. NOT an -intel/-large runner
    # either: project.yml pins ARCHS arm64 and excludes x86_64 for the simulator
    # SDK, so an x64 host cannot run the build it produces. macos-26 (arm64)
    # ships Xcode 26.5 with iOS 26.2/26.4/26.5 simulator runtimes preinstalled —
    # no -downloadPlatform needed. (Coverage of the actual 18.x floor would need
    # an older runtime download — not done here.)
    runs-on: macos-26
    # TEMPORARILY DISABLED — this is the one that actually hurt: a macOS runner is
    # billed at 10x Linux minutes (40-minute timeout), and `ios_native` fires on
    # any change under crates/{wire,device-proto,model}/ or remote-host/, so plenty
    # of PRs with nothing iOS-shaped about them were paying for it.
    # To restore, put the original gate back:
    #   if: ${{ github.event.pull_request.draft == false && needs.changes.outputs.ios_native == 'true' }}
    if: false
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app/ios
    env:
      # `brew update` alone burns 1-3 min, billed at 10x.
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-ios-sim
          cache-workspaces: app/ios
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/ios/web/pnpm-lock.yaml

      # The single biggest cost lever on this job. build-core.sh compiles the
      # ~286-crate graph TWICE (once for aarch64-apple-ios-sim, once for the
      # host cdylib that uniffi-bindgen reads) with no sharing between them —
      # ~8-12 min cold, at 10x. Most iOS PRs touch only Swift or the web bundle,
      # so key the products on the ffi inputs and skip the whole chain on a hit.
      - id: core-cache
        uses: actions/cache@v4
        with:
          path: |
            app/ios/Externals/BayboCore.xcframework
            app/ios/Generated/BayboCore.swift
          key: bayboffi-${{ runner.os }}-${{ hashFiles('app/ios/ffi/**', 'app/ios/bindgen/**', 'app/ios/Cargo.lock', 'rust-toolchain.toml', 'crates/wire/**', 'crates/device-proto/**', 'crates/model/**', 'remote-host/**') }}

      # --sim-only also SKIPS the codesign step, so this needs no keychain and no
      # Apple account (an unsigned xcframework is fine for a simulator build).
      - name: Rust core -> xcframework + bindings
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: scripts/build-core.sh --sim-only

      # Order is load-bearing, not cosmetic: xcodegen's spec references
      # Generated/, Externals/ and App/Resources/transcript/, and a missing
      # source path is a spec VALIDATION ERROR — on a fresh checkout the project
      # cannot even be generated until all three exist.
      - name: Transcript bundle -> App/Resources/transcript
        run: |
          (cd web && pnpm install --frozen-lockfile && pnpm build)
          rm -rf App/Resources/transcript
          mkdir -p App/Resources/transcript
          cp -R web/dist/. App/Resources/transcript/
      - run: xcodegen generate

      # The entitlements carry aps-environment, an app group, and
      # keychain-access-groups $(AppIdentifierPrefix)com.baybo.app — and
      # $(AppIdentifierPrefix) only resolves from a provisioning profile, which a
      # runner has no keychain to hold. The simulator enforces neither signatures
      # nor keychain access groups, so dropping them changes no test behaviour.
      # CODE_SIGN_ENTITLEMENTS="" and DEVELOPMENT_TEAM="" are the two that
      # actually defuse this project; the rest are the standard unsigned set.
      #
      # OS=latest, never a pinned version: iOS 26.0/26.1 ship an SDK but NO
      # runtime on this image, and GitHub rotates the runtime set monthly.
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Baybo.xcodeproj -scheme Baybo -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            | xcbeautify

      # GATING. This is also the only thing in the repo that catches UniFFI seam
      # drift: Generated/BayboCore.swift is regenerated from the Rust on every
      # build, so a renamed ffi method breaks the Swift compile and nothing else
      # anywhere would notice.
      - name: Unit tests (BayboTests)
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Baybo.xcodeproj -scheme Baybo \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath build/DerivedData \
            -only-testing:BayboTests \
            -resultBundlePath build/TestResults/unit.xcresult | xcbeautify

      # NON-GATING, same call the repo already makes for the tmux render tests:
      # these drive real gestures against a simulator and are timing-sensitive
      # under load. A regression surfaces without wedging merges. Promote to
      # gating once they have proven stable over a few weeks of real runs.
      #
      # A step-level continue-on-error rather than a second job: a separate macOS
      # job would re-pay runner boot + toolchain setup at 10x to run 4 minutes of
      # tests it already has the built products for.
      - name: UI smokes (non-gating)
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Baybo.xcodeproj -scheme Baybo \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath build/DerivedData \
            -only-testing:BayboUITests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            -resultBundlePath build/TestResults/ui.xcresult | xcbeautify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-xcresult
          path: app/ios/build/TestResults/
