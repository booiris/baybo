name: CI

# CI runs only on PRs, never on plain pushes (incl. master) — keeps the
# private-repo Actions minutes down. Draft PRs still fire opened/synchronize,
# but the per-job `if` skips them (a skipped job spins up no runner → zero
# billed minutes); marking a PR "Ready for review" fires ready_for_review and
# lets CI through.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Newer pushes to a PR cancel the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The repo's .cargo/config.toml pins sccache as the rustc wrapper and
  # -fuse-ld=lld; stock GitHub runners have neither. Disable both for CI —
  # the toolchain action handles caching and the default linker is fine here.
  RUSTC_WRAPPER: ""
  RUSTFLAGS: ""

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v4
      # Channel + components come from rust-toolchain.toml; this action
      # reads it and caches the cargo registry/target.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo clippy --all --benches --tests --examples --all-features --locked -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # The grep builtin shells out to ripgrep, so its tests need `rg` on
      # PATH; the real-terminal rendering tests (via aura-term-harness)
      # drive tmux. Both self-skip when their backend is absent, but we
      # install them so the suites actually run here. (Docker- and
      # bwrap-backed tests still self-skip — their backends aren't stock.)
      - run: sudo apt-get update -qq && sudo apt-get install -y ripgrep tmux
      - run: cargo test --workspace --locked

  ts-bindings:
    name: ts-rs bindings sync
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: scripts/check-ts-bindings.sh

  frontend:
    name: frontend (typecheck + build + test)
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: the sidecars import @aura/channel-sdk, and the
      # channel-src/* test suites import from the gitignored dist/, so the
      # SDK's .d.ts and each package's dist/ must exist before typecheck and
      # test. pnpm builds in dependency order; this also builds the web
      # dashboard (gen:api + tsc -b + vite build).
      - run: pnpm -r --if-present run build
      # tsc --noEmit across the channel SDK + channel/tool sidecars
      - run: pnpm -r --if-present run check
      # node --test suites (channel SDK, channel + browser sidecars)
      - run: pnpm -r --if-present run test
