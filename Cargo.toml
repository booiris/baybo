[workspace]
resolver = "2"
members = [
    "crates/model",
    "crates/channels",
    "crates/llm",
    "crates/tools",
    "crates/workspace",
    "crates/context",
    "crates/session",
    "crates/job",
    "crates/memory",
    "crates/cost",
    "crates/query",
    "crates/trace",
    "crates/security",
    "crates/sandbox",
    "crates/agent",
    "crates/store",
    "crates/storage",
    "crates/skills",
    "crates/skills-assessor",
    "crates/subagent",
    "crates/task",
    "crates/cron",
    "crates/config",
    "crates/cli",
    "crates/gateway",
    "crates/tui",
    "crates/pairing",
    "crates/integration-tests",
    "crates/janitor",
    "crates/setup",
    "crates/term-harness",
    "bench/memory",
]
exclude = ["crates/security/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal crates
aura-model = { path = "crates/model" }
aura-channels = { path = "crates/channels" }
aura-llm = { path = "crates/llm" }
aura-tools = { path = "crates/tools" }
aura-workspace = { path = "crates/workspace", default-features = false }
aura-context = { path = "crates/context" }
aura-session = { path = "crates/session" }
aura-job = { path = "crates/job" }
aura-memory = { path = "crates/memory" }
aura-cost = { path = "crates/cost" }
aura-query = { path = "crates/query" }
aura-trace = { path = "crates/trace" }
aura-security = { path = "crates/security" }
aura-sandbox = { path = "crates/sandbox" }
aura-agent = { path = "crates/agent" }
aura-store = { path = "crates/store" }
aura-storage = { path = "crates/storage" }
aura-skills = { path = "crates/skills" }
aura-skills-assessor = { path = "crates/skills-assessor" }
aura-subagent = { path = "crates/subagent" }
aura-task = { path = "crates/task" }
aura-cron = { path = "crates/cron" }
aura-config = { path = "crates/config" }
aura-cli = { path = "crates/cli" }
aura-gateway = { path = "crates/gateway" }
aura-tui = { path = "crates/tui" }
aura-pairing = { path = "crates/pairing" }
aura-integration-tests = { path = "crates/integration-tests" }
aura-janitor = { path = "crates/janitor" }
aura-setup = { path = "crates/setup" }
aura-term-harness = { path = "crates/term-harness" }
# External dependencies
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
    "registry",
] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
ulid = { version = "1", features = ["serde"] }
regex = "1"
aho-corasick = "1"
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
hkdf = "0.12"
aes-gcm = "0.10"
rand = "0.10"
# Local-only — never connects to a remote turso/libsql server, so we
# drop default features (`replication`, `remote`, `sync`, `tls`) that
# would pull in hyper-rustls + an old rustls/webpki tree.
libsql = { version = "0.9", default-features = false, features = ["core"] }
axum = "0.8"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = [
    "tokio",
    "server",
    "server-auto",
    "client-legacy",
    "http1",
] }
http-body-util = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
teloxide = { version = "0.17", features = ["macros"] }
serenity = { version = "0.12", features = ["client", "gateway", "model"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
reqwest = { version = "0.13", features = ["json", "socks"] }
dom_smoothie = "0.17"
htmd = "0.5"
bytes = "1"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
cron = "0.15"
futures = "0.3"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
rig = { package = "rig-core", version = "0.37", features = ["derive"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
shell-words = "1"
tiktoken-rs = "0.11"
unicode-width = "0.2"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
glob = "0.3"
walkdir = "2"
libc = "0.2"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"
parking_lot = "0.12"
dashmap = "6"
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "handshake",
] }
rmp-serde = "1"
ts-rs = { version = "11", features = ["serde-compat", "no-serde-warnings"] }
# Sidecar embedding: zstd decompresses each esbuild-produced JS bundle
# at runtime. Bundles themselves are produced by `pnpm bundle` in
# `crates/gateway/build.rs`.
zstd = "0.13"
# MCP client: rmcp for the protocol + transports, oauth2 for the
# authorization-code-with-PKCE flow, `open` to launch the user's browser
# during `aura mcp add` against an OAuth-protected HTTP server, base64 for
# PKCE challenge encoding.
rmcp = { version = "1.5", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest",
    "auth",
] }
oauth2 = "5"
open = "5"
base64 = "0.22"

[package]
name = "aura"
version.workspace = true
edition.workspace = true

[features]
# Build a benchmark-only `aura` that recalls memory but never writes it, so the
# LOCOMO bench (`bench/memory`) can drive the real agent end-to-end without QA
# turns polluting the recall scope. Wraps the backend in
# `aura_memory::ReadOnlyMemory` (see `src/runtime.rs`). NOT for production.
bench-readonly-memory = ["aura-memory/bench-readonly-memory"]

# Build a benchmark-only `aura` that compiles in `sandbox.mode = passthrough`
# support: shell commands run DIRECTLY — no OS sandbox, no work-dir jail, cwd
# inherited from the process — so aura can act as a Terminal-Bench agent INSIDE a
# disposable task container (where bwrap is unavailable and double-isolation is
# pointless). Without this feature the `[sandbox]` config, the passthrough Bash
# path, and its prompt are NOT compiled at all; a `sandbox` config key is then an
# unknown field (ignored) → aura stays sandboxed. NOT for production.
bench-passthrough = ["aura-config/bench-passthrough", "aura-tools/bench-passthrough"]

[dependencies]
aura-model = { workspace = true }
aura-channels = { workspace = true }
aura-llm = { workspace = true }
aura-tools = { workspace = true }
aura-workspace = { workspace = true, features = ["io"] }
aura-context = { workspace = true }
aura-job = { workspace = true }
aura-memory = { workspace = true }
aura-cost = { workspace = true }
aura-trace = { workspace = true }
aura-security = { workspace = true }
aura-sandbox = { workspace = true }
aura-agent = { workspace = true }
aura-cron = { workspace = true }
aura-janitor = { workspace = true }
aura-storage = { workspace = true }
aura-store = { workspace = true }
aura-skills = { workspace = true }
aura-skills-assessor = { workspace = true }
aura-subagent = { workspace = true }
aura-task = { workspace = true }
aura-config = { workspace = true }
aura-cli = { workspace = true }
aura-gateway = { workspace = true }
aura-setup = { workspace = true }
aura-tui = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
futures = { workspace = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "abort"

# Each test target re-links the whole upper dep graph; full DWARF dominates
# link time. `line-tables-only` keeps usable backtraces, `unpacked` skips
# bundling `.dwo`s back into the executable after link.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false
