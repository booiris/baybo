[workspace]
resolver = "2"
members = [
    "crates/model",
    "crates/channels",
    "crates/llm",
    "crates/tools",
    "crates/workspace",
    "crates/context",
    "crates/session",
    "crates/job",
    "crates/trace",
    "crates/security",
    "crates/hook",
    "crates/agent",
    "crates/storage",
    "crates/skills",
    "crates/skills-assessor",
    "crates/cron",
    "crates/config",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal crates
aura-model = { path = "crates/model" }
aura-channels = { path = "crates/channels" }
aura-llm = { path = "crates/llm" }
aura-tools = { path = "crates/tools" }
aura-workspace = { path = "crates/workspace" }
aura-context = { path = "crates/context" }
aura-session = { path = "crates/session" }
aura-job = { path = "crates/job" }
aura-trace = { path = "crates/trace" }
aura-security = { path = "crates/security" }
aura-hook = { path = "crates/hook" }
aura-agent = { path = "crates/agent" }
aura-storage = { path = "crates/storage" }
aura-skills = { path = "crates/skills" }
aura-skills-assessor = { path = "crates/skills-assessor" }
aura-cron = { path = "crates/cron" }
aura-config = { path = "crates/config" }
aura-cli = { path = "crates/cli" }
# External dependencies
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
    "registry",
] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
regex = "1"
tokio-util = "0.7"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.10"
libsql = "0.9"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
teloxide = { version = "0.17", features = ["macros"] }
serenity = { version = "0.12", features = ["client", "gateway", "model"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
reqwest = { version = "0.12", features = ["json"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
cron = "0.15"
futures = "0.3"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
rig-core = { version = "0.34", features = ["derive"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
shell-words = "1"
tiktoken-rs = "0.11"
unicode-width = "0.2"
tempfile = "3"
glob = "0.3"
walkdir = "2"

[package]
name = "aura"
version.workspace = true
edition.workspace = true

[dependencies]
aura-model = { workspace = true }
aura-channels = { workspace = true }
aura-llm = { workspace = true }
aura-tools = { workspace = true }
aura-workspace = { workspace = true }
aura-context = { workspace = true }
aura-session = { workspace = true }
aura-job = { workspace = true }
aura-trace = { workspace = true }
aura-security = { workspace = true }
aura-hook = { workspace = true }
aura-agent = { workspace = true }
aura-storage = { workspace = true }
aura-skills = { workspace = true }
aura-skills-assessor = { workspace = true }
aura-config = { workspace = true }
aura-cli = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
hex = { workspace = true }
clap = { workspace = true }
