[workspace]
resolver = "2"
members = [
    "crates/model",
    "crates/channels",
    "crates/wire",
    "crates/device-proto",
    "crates/llm",
    "crates/tools",
    "crates/workspace",
    "crates/context",
    "crates/session",
    "crates/turn",
    "crates/memory",
    "crates/cost",
    "crates/query",
    "crates/trace",
    "crates/security",
    "crates/sandbox",
    "crates/agent",
    "crates/store",
    "crates/storage",
    "crates/skills",
    "crates/skills-assessor",
    "crates/subagent",
    "crates/task",
    "crates/cron",
    "crates/deck",
    "crates/config",
    "crates/cli",
    "crates/gateway",
    "crates/tui",
    "crates/pairing",
    "crates/integration-tests",
    "crates/janitor",
    "crates/setup",
    "crates/term-harness",
    "crates/baybo",
    "bench/memory",
    "bench/swe",
    "bench/bench-web",
]
# `cargo run` / bare `cargo build` operate on the `baybo` binary by default;
# the rest of the workspace is reached with `--workspace` or `-p <crate>`.
default-members = ["crates/baybo"]
exclude = ["crates/security/fuzz", "remote-host"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal crates
baybo-model = { path = "crates/model" }
baybo-channels = { path = "crates/channels" }
wire = { path = "crates/wire" }
device-proto = { path = "crates/device-proto" }
# The remote-host (C) wire contract, path-depended across the workspace boundary
# (like wire/device-proto) so the gateway uses C's route paths + types directly.
remote-host-protocol = { path = "remote-host/crates/protocol" }
# The relay server + its in-memory admission, path-depended across the boundary
# for the gateway's relay-content e2e harness ONLY (dev-dependencies). They boot a
# real C in-process so the spliced relay path is proven without a deployment.
remote-host-relay = { path = "remote-host/crates/relay" }
remote-host-admission = { path = "remote-host/crates/admission" }
baybo-llm = { path = "crates/llm" }
baybo-tools = { path = "crates/tools" }
baybo-workspace = { path = "crates/workspace", default-features = false }
baybo-context = { path = "crates/context" }
baybo-session = { path = "crates/session" }
baybo-turn = { path = "crates/turn" }
baybo-memory = { path = "crates/memory" }
baybo-cost = { path = "crates/cost" }
baybo-query = { path = "crates/query" }
baybo-trace = { path = "crates/trace" }
baybo-security = { path = "crates/security" }
baybo-sandbox = { path = "crates/sandbox" }
baybo-agent = { path = "crates/agent" }
baybo-store = { path = "crates/store" }
baybo-storage = { path = "crates/storage" }
baybo-skills = { path = "crates/skills" }
baybo-skills-assessor = { path = "crates/skills-assessor" }
baybo-subagent = { path = "crates/subagent" }
baybo-task = { path = "crates/task" }
baybo-cron = { path = "crates/cron" }
baybo-deck = { path = "crates/deck" }
baybo-config = { path = "crates/config" }
baybo-cli = { path = "crates/cli" }
baybo-gateway = { path = "crates/gateway" }
baybo-tui = { path = "crates/tui" }
baybo-pairing = { path = "crates/pairing" }
baybo-integration-tests = { path = "crates/integration-tests" }
baybo-janitor = { path = "crates/janitor" }
baybo-setup = { path = "crates/setup" }
baybo-term-harness = { path = "crates/term-harness" }
baybo-bench-web = { path = "bench/bench-web" }
# External dependencies
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
# default-features = false ON PURPOSE: the defaults ship remote $ref
# resolution (reqwest/file) — an agent-written deck-card spec must never
# make schema compilation touch the network or the filesystem.
jsonschema = { version = "0.48", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
    "registry",
] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
ulid = { version = "1", features = ["serde"] }
regex = "1"
aho-corasick = "1"
# Media container metadata (AttachFile probes a track's duration at attach time):
# lofty for audio, mp4 for ISO BMFF video (mp4/mov), matroska for webm/mkv,
# mp3-duration for the MP3 frame walk (header math lies for VBR).
lofty = "0.22"
mp3-duration = "0.1"
mp4 = "0.14"
matroska = "0.30"
# PDF page count (a native PDF is billed per PAGE, so the count is the only
# honest price input). A real parser, not a `/Type /Page` scan: PDF 1.5 packs
# page objects into Flate-compressed object streams, where a byte scan of a
# 64-page document finds zero. Default features are off — they pull three
# date-time crates and rayon for document *authoring*, which this never does.
lopdf = { version = "0.44", default-features = false }
# Image pixel dimensions (a provider tiles an image by PIXELS and bills per
# tile, so a byte cap bounds nothing). Header parser, not a decoder: it reads
# the few bytes that carry width/height and never allocates a frame buffer, and
# it has no dependencies of its own. Covers every raster MIME the delivery path
# accepts — PNG, JPEG, GIF, WebP, HEIF/HEIC.
imagesize = "0.13"
# Test-only: builds the compressed object stream the PDF page-count probe has
# to see through. Already in the tree under `lopdf` / `lofty`.
flate2 = "1"
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
hkdf = "0.12"
aes-gcm = "0.10"
rand = "0.10"
# Device-pairing + E2E secure channel (device-proto, shared by the
# gateway and the iOS companion's core). Noise XXpsk0 authenticates pairing
# against a malicious relay (the QR secret is the PSK), Noise XX/IK secures the
# post-pairing session, ChaCha20-Poly1305 frames the lock-screen-preview the iOS
# NSE decrypts with CryptoKit. All cross-compile to aarch64-apple-ios.
snow = "0.9"
chacha20poly1305 = "0.10"
# Zeroize the 32-byte pairing secret (the Noise PSK) on drop so it never
# lingers in freed memory; cross-compiles to aarch64-apple-ios.
zeroize = { version = "1", features = ["derive"] }
# `Connection` is `Send` but deliberately NOT `Sync`, so the compiler
# forbids two threads from entering one sqlite handle — the invariant the
# C API requires and that a driver cannot uphold with a comment alone.
# `bundled` pins the SQLite build to the crate rather than the host's, and
# libsqlite3-sys carries `links = "sqlite3"`, so exactly one version may exist
# in the graph.
#
# The floor is load-bearing: SQLite 3.51.1 and 3.51.2 (rusqlite 0.38) invert
# the lock order between the process-global `unixBigLock` and a file's inode
# mutex (`unixLock` → `unixIsSharingShmNode` → `unixEnterMutex`, the order
# sqlite's own comment marks ERROR), so one thread closing a database while
# another opens one deadlocks — across *unrelated* files, since one of the two
# mutexes is process-global. Upstream fixed it in 3.51.3; rusqlite 0.40
# bundles 3.53.2. Anything that would drag this back to 0.38 (a pool crate
# pinning an older rusqlite, say) re-arms the hang.
rusqlite = { version = "0.40", features = ["bundled"] }
axum = "0.8"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = [
    "tokio",
    "server",
    "server-auto",
    "client-legacy",
    "http1",
] }
http-body-util = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
teloxide = { version = "0.17", features = ["macros"] }
serenity = { version = "0.12", features = ["client", "gateway", "model"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
reqwest = { version = "0.13", features = ["json", "socks"] }
# Direct handle on rustls so the gateway can pin the process-wide CryptoProvider
# before its relay `wss://` client dials. The graph enables BOTH aws-lc-rs and
# ring (via reqwest/hyper-rustls), so rustls can't auto-select one and
# connect_async would panic; we install aws-lc-rs explicitly. default-features
# off — the rest of the graph already unions in std/tls12/ring.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
dom_smoothie = "0.17"
htmd = "0.5"
bytes = "1"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
cron = "0.15"
futures = "0.3"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
rig = { package = "rig-core", version = "0.37", features = ["derive"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
shell-words = "1"
brush-parser = "0.4"
tiktoken-rs = "0.11"
unicode-width = "0.2"
unicode-normalization = "0.1"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
libc = "0.2"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"
parking_lot = "0.12"
dashmap = "6"
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "handshake",
] }
rmp-serde = "1"
# Terminal QR rendering for `device pair`; default-features off drops the heavy
# `image`/`svg` renderers — we only use the unicode (Dense1x2) renderer.
qrcode = { version = "0.14", default-features = false }
ts-rs = { version = "11", features = ["serde-compat", "no-serde-warnings"] }
# Sidecar embedding: zstd decompresses each esbuild-produced JS bundle
# at runtime. Bundles themselves are produced by `pnpm bundle` in
# `crates/gateway/build.rs`.
zstd = "0.13"
# MCP client: rmcp for the protocol + transports, oauth2 for the
# authorization-code-with-PKCE flow, `open` to launch the user's browser
# during `baybo mcp add` against an OAuth-protected HTTP server, base64 for
# PKCE challenge encoding.
rmcp = { version = "1.5", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest",
    "auth",
] }
oauth2 = "5"
open = "5"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "abort"

# Each test target re-links the whole upper dep graph; full DWARF dominates
# link time. `line-tables-only` keeps usable backtraces, `unpacked` skips
# bundling `.dwo`s back into the executable after link.
#
# `incremental = false` was measured, not assumed: with sccache serving the
# rlib units, turning incremental on made the base-crate rebuild WORSE here
# (~88s vs ~58s over three runs) because 40+ link-producing units each carry
# GB-scale incremental state, and the resulting I/O outweighs the saved
# codegen. It only won for edits confined to one mid-tier crate. Re-measure
# before flipping it; don't flip it on the strength of the general advice.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

# Dependencies only — cargo's `"*"` never matches workspace members, so every
# baybo-* crate keeps opt-level 0 and its fast debug build. Deps are compiled
# once and then executed by 2992 tests, and at -O0 the suite spent its time
# inside them: bundled sqlite3 (this also flips libsqlite3-sys's cc build to
# -O2 via OPT_LEVEL), regex NFA construction, the tiktoken BPE table, and the
# crypto/hash chain. Worth ~4s of a 10.4s run for a one-time dep rebuild.
# `debug-assertions`/`overflow-checks` are deliberately left at the profile
# default so nothing the tests rely on is switched off.
[profile.dev.package."*"]
opt-level = 2

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false
