[workspace]
resolver = "2"
members = [
    "crates/model",
    "crates/channels",
    "crates/wire",
    "crates/device-proto",
    "crates/llm",
    "crates/tools",
    "crates/workspace",
    "crates/context",
    "crates/session",
    "crates/job",
    "crates/memory",
    "crates/cost",
    "crates/query",
    "crates/trace",
    "crates/security",
    "crates/sandbox",
    "crates/agent",
    "crates/store",
    "crates/storage",
    "crates/skills",
    "crates/skills-assessor",
    "crates/subagent",
    "crates/task",
    "crates/cron",
    "crates/config",
    "crates/cli",
    "crates/gateway",
    "crates/tui",
    "crates/pairing",
    "crates/integration-tests",
    "crates/janitor",
    "crates/setup",
    "crates/term-harness",
    "bench/memory",
    "bench/swe",
    "bench/bench-web",
]
exclude = ["crates/security/fuzz", "remote-host", "app/mobile"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal crates
baybo-model = { path = "crates/model" }
baybo-channels = { path = "crates/channels" }
wire = { path = "crates/wire" }
device-proto = { path = "crates/device-proto" }
baybo-llm = { path = "crates/llm" }
baybo-tools = { path = "crates/tools" }
baybo-workspace = { path = "crates/workspace", default-features = false }
baybo-context = { path = "crates/context" }
baybo-session = { path = "crates/session" }
baybo-job = { path = "crates/job" }
baybo-memory = { path = "crates/memory" }
baybo-cost = { path = "crates/cost" }
baybo-query = { path = "crates/query" }
baybo-trace = { path = "crates/trace" }
baybo-security = { path = "crates/security" }
baybo-sandbox = { path = "crates/sandbox" }
baybo-agent = { path = "crates/agent" }
baybo-store = { path = "crates/store" }
baybo-storage = { path = "crates/storage" }
baybo-skills = { path = "crates/skills" }
baybo-skills-assessor = { path = "crates/skills-assessor" }
baybo-subagent = { path = "crates/subagent" }
baybo-task = { path = "crates/task" }
baybo-cron = { path = "crates/cron" }
baybo-config = { path = "crates/config" }
baybo-cli = { path = "crates/cli" }
baybo-gateway = { path = "crates/gateway" }
baybo-tui = { path = "crates/tui" }
baybo-pairing = { path = "crates/pairing" }
baybo-integration-tests = { path = "crates/integration-tests" }
baybo-janitor = { path = "crates/janitor" }
baybo-setup = { path = "crates/setup" }
baybo-term-harness = { path = "crates/term-harness" }
baybo-bench-web = { path = "bench/bench-web" }
# External dependencies
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
    "registry",
] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
ulid = { version = "1", features = ["serde"] }
regex = "1"
aho-corasick = "1"
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
hkdf = "0.12"
aes-gcm = "0.10"
rand = "0.10"
# Device-pairing + E2E secure channel (device-proto, shared by the
# gateway and the iOS companion's core). SPAKE2 over the rendezvous, Noise
# for the session, ChaCha20-Poly1305 for the lock-screen-preview framing the
# iOS NSE decrypts with CryptoKit. All cross-compile to aarch64-apple-ios.
snow = "0.9"
spake2 = "0.4"
chacha20poly1305 = "0.10"
# Local-only — never connects to a remote turso/libsql server, so we
# drop default features (`replication`, `remote`, `sync`, `tls`) that
# would pull in hyper-rustls + an old rustls/webpki tree.
libsql = { version = "0.9", default-features = false, features = ["core"] }
axum = "0.8"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = [
    "tokio",
    "server",
    "server-auto",
    "client-legacy",
    "http1",
] }
http-body-util = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
teloxide = { version = "0.17", features = ["macros"] }
serenity = { version = "0.12", features = ["client", "gateway", "model"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
reqwest = { version = "0.13", features = ["json", "socks"] }
dom_smoothie = "0.17"
htmd = "0.5"
bytes = "1"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
cron = "0.15"
futures = "0.3"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
rig = { package = "rig-core", version = "0.37", features = ["derive"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
shell-words = "1"
tiktoken-rs = "0.11"
unicode-width = "0.2"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
glob = "0.3"
walkdir = "2"
libc = "0.2"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"
parking_lot = "0.12"
dashmap = "6"
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "handshake",
] }
rmp-serde = "1"
# Terminal QR rendering for `device pair`; default-features off drops the heavy
# `image`/`svg` renderers — we only use the unicode (Dense1x2) renderer.
qrcode = { version = "0.14", default-features = false }
ts-rs = { version = "11", features = ["serde-compat", "no-serde-warnings"] }
# Sidecar embedding: zstd decompresses each esbuild-produced JS bundle
# at runtime. Bundles themselves are produced by `pnpm bundle` in
# `crates/gateway/build.rs`.
zstd = "0.13"
# MCP client: rmcp for the protocol + transports, oauth2 for the
# authorization-code-with-PKCE flow, `open` to launch the user's browser
# during `baybo mcp add` against an OAuth-protected HTTP server, base64 for
# PKCE challenge encoding.
rmcp = { version = "1.5", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest",
    "auth",
] }
oauth2 = "5"
open = "5"
base64 = "0.22"

[package]
name = "baybo"
version.workspace = true
edition.workspace = true

[features]
# Build a benchmark-only `baybo` that recalls memory but never writes it, so the
# LOCOMO bench (`bench/memory`) can drive the real agent end-to-end without QA
# turns polluting the recall scope. Wraps the backend in
# `baybo_memory::ReadOnlyMemory` (see `src/runtime.rs`). NOT for production.
bench-readonly-memory = ["baybo-memory/bench-readonly-memory"]

# Compile the Bash tool's bench profile: run shell commands raw inside an
# already-disposable container — no uv shims, no work-dir jail, cwd inherited
# from the process, and a dedicated prompt. Also skips the workspace
# identity-repo `git init` (baybo-workspace) so a bench container needs no `git`
# on PATH. Distinct from the `sandbox.mode = none` config (which only drops the
# OS sandbox but keeps uv + the work/ jail). Off by default; absent in every
# prod build. For bench/swe + bench/terminal-bench-1.0.
bench-bash = ["baybo-tools/bench-bash", "baybo-workspace/bench-bash"]

[dependencies]
baybo-model = { workspace = true }
baybo-channels = { workspace = true }
baybo-llm = { workspace = true }
baybo-tools = { workspace = true }
baybo-workspace = { workspace = true, features = ["io"] }
baybo-context = { workspace = true }
baybo-job = { workspace = true }
baybo-memory = { workspace = true }
baybo-cost = { workspace = true }
baybo-trace = { workspace = true }
baybo-security = { workspace = true }
baybo-sandbox = { workspace = true }
baybo-agent = { workspace = true }
baybo-cron = { workspace = true }
baybo-janitor = { workspace = true }
baybo-storage = { workspace = true }
baybo-store = { workspace = true }
baybo-skills = { workspace = true }
baybo-skills-assessor = { workspace = true }
baybo-subagent = { workspace = true }
baybo-task = { workspace = true }
baybo-config = { workspace = true }
baybo-cli = { workspace = true }
baybo-gateway = { workspace = true }
baybo-pairing = { workspace = true }
baybo-setup = { workspace = true }
baybo-tui = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
futures = { workspace = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "abort"

# Each test target re-links the whole upper dep graph; full DWARF dominates
# link time. `line-tables-only` keeps usable backtraces, `unpacked` skips
# bundling `.dwo`s back into the executable after link.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false
