# remote-host "C" role — one service, one listener. The relay is always on; the
# push role turns on automatically when you configure an APNs .p8
# (APNS_P8_HOST_PATH in .env). Their route paths are disjoint (/notify +
# /register vs /pair, /content, /control).
#
# Admitted gateways live in a SQLite table (./data/admission.db by default),
# hot-reloaded by polling — add/remove keys out of band (see DEPLOY.md), no
# restart needed.
#
# Serves plain ws/http by default. Set TLS_CERT_HOST_PATH + TLS_KEY_HOST_PATH in
# .env and it serves wss/https instead; set PORT=443 for port-less URLs.
#
# One-click:
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d --build

secrets:
  # The .p8 — falls back to a /dev/null placeholder when unset (push stays off,
  # so it's never read). Mounted read-only; never enters an image layer.
  apns_p8:
    file: ${APNS_P8_HOST_PATH:-/dev/null}

services:
  remote-host:
    build:
      context: .
      dockerfile: Dockerfile
    image: remote-host:latest
    restart: unless-stopped
    environment:
      # The listen port, host + container the same (default 7777). The container
      # runs as root, so a privileged PORT like 443 binds fine.
      BIND_ADDR: 0.0.0.0:${PORT:-7777}
      # gateway admission allow-list — a SQLite table on the /data volume
      ADMISSION_DB_PATH: /data/admission.db
      ADMISSION_POLL_SECS: ${ADMISSION_POLL_SECS:-30}
      # fallback cap on simultaneous relay connections one admitted key may hold
      # (per-key value in the remote_api_keys table overrides it)
      MAX_CONNS_PER_REMOTE_API_KEY_FALLBACK: ${MAX_CONNS_PER_REMOTE_API_KEY_FALLBACK:-64}
      # per-source-IP flood backstop, ALWAYS ON, fronting BOTH the relay WS upgrades
      # and the push /register + /notify routes, keyed on the socket peer — correct
      # when this binary terminates TLS for the real client. Behind a proxy that
      # terminates TLS (e.g. Cloudflare) the peer is the proxy edge, so set
      # CLIENT_IP_HEADERS to the proxy's real-client-IP header (e.g. cf-connecting-ip)
      # — else every client shares one bucket. Trust a client-IP header ONLY when
      # this origin is reachable solely via that proxy (CF IP allowlist / Tunnel /
      # mTLS) — else it's forgeable. See DEPLOY.md. Client-IP resolution is SHARED;
      # rate / burst / bucket cap are per role (relay vs push), blank -> defaults.
      CLIENT_IP_HEADERS: ${CLIENT_IP_HEADERS:-}
      RELAY_IP_RATE_PER_SEC: ${RELAY_IP_RATE_PER_SEC:-}
      RELAY_IP_BURST: ${RELAY_IP_BURST:-}
      RELAY_IP_BUCKET_CAP: ${RELAY_IP_BUCKET_CAP:-}
      PUSH_IP_RATE_PER_SEC: ${PUSH_IP_RATE_PER_SEC:-}
      PUSH_IP_BURST: ${PUSH_IP_BURST:-}
      PUSH_IP_BUCKET_CAP: ${PUSH_IP_BUCKET_CAP:-}
      # push — enabled automatically when APNS_P8_HOST_PATH is set in .env
      APNS_P8_PATH: ${APNS_P8_HOST_PATH:+/run/secrets/apns_p8}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      # optional global push-limit overrides (blank -> built-in defaults; see
      # DEPLOY.md). The /register + /notify routes are keyless.
      PUSH_DEVICE_STORE_CAP: ${PUSH_DEVICE_STORE_CAP:-}
      PUSH_UNCONFIRMED_TTL_SECS: ${PUSH_UNCONFIRMED_TTL_SECS:-}
      PUSH_NOTIFY_RATE_PER_MIN: ${PUSH_NOTIFY_RATE_PER_MIN:-}
      PUSH_NOTIFY_BURST: ${PUSH_NOTIFY_BURST:-}
      # TLS — set only when a cert is configured (-> wss/https), else blank (-> ws/http)
      TLS_CERT: ${TLS_CERT_HOST_PATH:+/run/tls/cert.pem}
      TLS_KEY: ${TLS_KEY_HOST_PATH:+/run/tls/key.pem}
      # Logging — rolling daily files at LOG_DIR (on the /data volume, so they
      # land on the host ./data/logs and survive `up --build`), 14 days retained,
      # also mirrored to stderr/`docker compose logs`. RUST_LOG tunes verbosity;
      # blank -> the built-in default (deps at warn, our crates at info — quiet by
      # design for a public endpoint).
      RUST_LOG: ${RUST_LOG:-}
      LOG_DIR: ${LOG_DIR:-/data/logs}
    secrets:
      - apns_p8
    volumes:
      # The admission DB — bind-mounted so you can edit it from the host
      # (sqlite3 ./data/admission.db ...).
      - ${ADMISSION_DIR:-./data}:/data
      - ${TLS_CERT_HOST_PATH:-/dev/null}:/run/tls/cert.pem:ro
      - ${TLS_KEY_HOST_PATH:-/dev/null}:/run/tls/key.pem:ro
    ports:
      - "${PORT:-7777}:${PORT:-7777}"
    # The durable log copy is the rolling file on the /data volume (./data/logs).
    # This caps the Docker-captured stderr mirror so it can't grow unbounded.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
