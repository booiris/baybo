[package]
name = "remote-host-push"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
jsonwebtoken = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
axum = { workspace = true }
# Real APNs egress: reqwest negotiates HTTP/2 over TLS (ALPN), as APNs requires.
reqwest = { workspace = true }
# The shared admission trait (the live allow-list is wired by the server binary).
remote-host-admission = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower = { workspace = true }
