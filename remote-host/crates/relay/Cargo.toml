[package]
name = "remote-host-relay"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
parking_lot = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# The pairing-rendezvous + data-leg WS server: pump axum WebSocket frames in and
# out of a RelayLeg.
axum = { workspace = true, features = ["ws"] }
futures = { workspace = true }
# The A<->C control connection: the gateway's hello + the OpenDataLeg signal are
# JSON over the control WS (the gateway's `relay/mod.rs` agrees on this shape).
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
# The shared admission trait (relay checks the live allow-list).
remote-host-admission = { workspace = true }
# The shared wire contract: route paths, x-remote-api-key, ControlHello/Signal.
remote-host-protocol = { workspace = true }
# The token-bucket primitive backing the per-key bandwidth throttle.
remote-host-edge = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tokio-tungstenite = { workspace = true }
