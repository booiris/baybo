# Direct in-process TLS (wss/https) — no reverse proxy needed. Overlay on top of
# the base compose:
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
#
# Provide a PEM cert + key (e.g. Let's Encrypt fullchain.pem + privkey.pem) via
# .env: TLS_CERT_HOST_PATH and TLS_KEY_HOST_PATH. Set PORT=443 for a port-less
# wss://host / https://host URL — push and relay then share that one port.

services:
  remote-host:
    environment:
      TLS_CERT: /run/tls/cert.pem
      TLS_KEY: /run/tls/key.pem
    volumes:
      - ${TLS_CERT_HOST_PATH:?set TLS_CERT_HOST_PATH in .env}:/run/tls/cert.pem:ro
      - ${TLS_KEY_HOST_PATH:?set TLS_KEY_HOST_PATH in .env}:/run/tls/key.pem:ro
